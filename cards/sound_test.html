<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>札対戦の試聴室</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      color: #263b33;
      background: #f4f1e8;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }

    .shell {
      max-width: 49rem;
      margin: auto;
      padding: 2rem 1rem 2.5rem;
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .75rem 1rem;
      margin-bottom: 1.3rem;
      padding: .95rem 1.1rem;
      border-radius: 1rem;
      color: #fffdf5;
      background: #214d3d;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 4.5vw, 1.85rem);
      letter-spacing: .04em;
    }

    .sound-toggle {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      padding: .4rem .65rem .4rem .8rem;
      border-color: #b3c5b6;
      color: inherit;
      background: transparent;
    }

    .sound-toggle:focus-visible { outline-color: #ffdd9b; }

    .toggle-state {
      min-width: 1.75rem;
      padding: .15rem .25rem;
      border-radius: .35rem;
      text-align: center;
      color: #214335;
      background: #f6e7bd;
    }

    .sound-toggle[aria-pressed="false"] .toggle-state { background: #dbdfd7; }

    section {
      margin-top: .85rem;
      padding: .9rem;
      border: 1px solid #d8d5c8;
      border-radius: .85rem;
      background: #fffdf6;
    }

    h2 {
      margin: 0 0 .65rem;
      font-size: 1.05rem;
    }

    p {
      margin: 0;
      color: #52645b;
      font-size: .875rem;
      line-height: 1.65;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 8.5rem), 1fr));
      gap: .45rem;
    }

    .effects {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    button {
      min-height: 3rem;
      padding: .48rem .65rem;
      border: 1px solid #c6ccbc;
      border-radius: .55rem;
      font: inherit;
      font-size: .9375rem;
      font-weight: 600;
      color: inherit;
      background: #f5f5ec;
      cursor: pointer;
      touch-action: manipulation;
    }

    .buttons button {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      text-align: left;
      min-height: 3.6rem;
    }

    .sound-name {
      font-size: .75rem;
      font-weight: 400;
      color: #506455;
    }

    .buttons button[aria-pressed="true"] {
      border-color: #46775b;
      color: #173d2b;
      background: #dbeadb;
      box-shadow: inset 0 0 0 1px #46775b;
    }

    button:focus-visible {
      outline: 2px solid #2b6546;
      outline-offset: 2px;
    }

    button:active:not(:disabled) { box-shadow: inset 0 0 0 2px currentColor; }
    button:disabled { opacity: .53; cursor: default; }

    @media (min-width: 34rem) {
      .shell { padding-inline: 1.5rem; }
      section { padding: 1.05rem; }
      .effects { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <h1>札対戦の試聴室</h1>
      <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="false">
        サウンド <span class="toggle-state" id="toggle-state" aria-hidden="true">切</span>
      </button>
    </header>

    <p id="sound-note">結果音・効果音を選ぶとBGMが止まります。</p>
    <noscript><p>試聴するにはJavaScriptを有効にしてください。</p></noscript>

    <section aria-labelledby="bgm-heading">
      <h2 id="bgm-heading">BGM</h2>
      <div class="buttons">
        <button type="button" data-bgm="lobby" aria-pressed="false">
          入口・手札配り <span class="sound-name">lobby</span>
        </button>
        <button type="button" data-bgm="match" aria-pressed="false">
          対戦中 <span class="sound-name">match</span>
        </button>
        <button type="button" data-bgm="">BGMを止める</button>
      </div>
    </section>

    <section aria-labelledby="jingle-heading">
      <h2 id="jingle-heading">結果音</h2>
      <div class="buttons">
        <button type="button" data-jingle="win">勝ち <span class="sound-name">win</span></button>
        <button type="button" data-jingle="lose">負け <span class="sound-name">lose</span></button>
        <button type="button" data-jingle="draw">引き分け <span class="sound-name">draw</span></button>
      </div>
    </section>

    <section aria-labelledby="effects-heading">
      <h2 id="effects-heading">効果音</h2>
      <div class="buttons effects">
        <button type="button" data-se="put">札を置く <span class="sound-name">put</span></button>
        <button type="button" data-se="flip">札が返る <span class="sound-name">flip</span></button>
        <button type="button" data-se="up">数字が上がる <span class="sound-name">up</span></button>
        <button type="button" data-se="down">数字が下がる <span class="sound-name">down</span></button>
        <button type="button" data-se="miss">取れなかった <span class="sound-name">miss</span></button>
        <button type="button" data-se="chain">連鎖・合計 <span class="sound-name">chain</span></button>
        <button type="button" data-se="guard">鉄壁・不屈 <span class="sound-name">guard</span></button>
        <button type="button" data-se="curse">祟り・道連れ <span class="sound-name">curse</span></button>
        <button type="button" data-se="seal">封印 <span class="sound-name">seal</span></button>
        <button type="button" data-se="gamble">博打 <span class="sound-name">gamble</span></button>
        <button type="button" data-se="coin">先攻コイン <span class="sound-name">coin</span></button>
        <button type="button" data-se="deal">手札を配る <span class="sound-name">deal</span></button>
        <button type="button" data-se="ready">これで勝負 <span class="sound-name">ready</span></button>
        <button type="button" data-se="tap">札を詳しく見る <span class="sound-name">tap</span></button>
      </div>
    </section>
  </main>

  <script src="./sound.js"></script>
  <script>
    (() => {
      const sound = window.FUDA_SND;
      const toggle = document.getElementById("sound-toggle");
      const toggleState = document.getElementById("toggle-state");
      const note = document.getElementById("sound-note");
      const buttons = document.querySelectorAll("main section button");
      const bgmButtons = document.querySelectorAll("[data-bgm][aria-pressed]");

      if (!sound || !(window.AudioContext || window.webkitAudioContext)) {
        note.textContent = sound
          ? "このブラウザでは試聴できません。"
          : "sound.jsを読み込めませんでした。同じフォルダに置いてください。";
        toggle.disabled = true;
        buttons.forEach((button) => { button.disabled = true; });
        return;
      }

      function updateToggle() {
        const on = sound.isOn();
        toggle.setAttribute("aria-pressed", String(on));
        toggleState.textContent = on ? "入" : "切";
        buttons.forEach((button) => { button.disabled = !on; });
      }

      function selectBgm(track) {
        sound.bgm(track);
        bgmButtons.forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.bgm === track));
        });
      }

      toggle.addEventListener("click", () => {
        sound.toggle();
        updateToggle();
      });

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          const { bgm, jingle, se } = button.dataset;
          if (bgm !== undefined) {
            selectBgm(bgm || null);
          } else {
            selectBgm(null);
            if (jingle) sound.jingle(jingle);
            else sound.se(se);
          }
        });
      });

      updateToggle();
    })();
  </script>
</body>
</html>
