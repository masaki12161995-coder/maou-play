function noise(x, y, salt = 0) {
  let value = Math.imul(x + 347, 374761393) + Math.imul(y + 31, 668265263) + Math.imul(salt, 14426957);
  value = Math.imul(value ^ value >>> 13, 1274126177);
  return (value ^ value >>> 16) >>> 0;
}

function rect(ctx, color, x, y, width, height) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), width, height);
}

function shape(ctx, color, x, y, points) {
  const low = Math.min(...points.map(point => point[1]));
  const high = Math.max(...points.map(point => point[1]));
  ctx.fillStyle = color;
  for (let line = low; line <= high; line += 1) {
    const hits = [];
    for (let i = 0; i < points.length; i += 1) {
      const [ax, ay] = points[i];
      const [bx, by] = points[(i + 1) % points.length];
      if ((ay <= line && by > line) || (by <= line && ay > line)) {
        hits.push(ax + (bx - ax) * (line - ay) / (by - ay));
      }
    }
    hits.sort((a, b) => a - b);
    for (let i = 0; i < hits.length; i += 2) {
      const start = Math.floor(hits[i]);
      ctx.fillRect(x + start, y + line, Math.floor(hits[i + 1]) - start + 1, 1);
    }
  }
}

function oval(ctx, color, cx, cy, rx, ry) {
  ctx.fillStyle = color;
  for (let y = -ry; y <= ry; y += 2) {
    const x = Math.round(rx * Math.sqrt(1 - (y / ry) ** 2));
    ctx.fillRect(cx - x, cy + y, x * 2 + 1, 2);
  }
}

  rect(ctx, colors[0], x + 2, y - height, 1, height);
  rect(ctx, colors[1], x + 4, y - height + 1, 1, height);
  rect(ctx, colors[0], x + 6, y - height + 3, 1, height - 3);
  rect(ctx, colors[1], x, y - 3, 1, 3);
  if (lit) rect(ctx, "#95845f", x + 3, y - height - 2, 2, 2);
}

  shape(ctx, "#325050", x - 5, top + 4, [[drift,0],[4,13],[-1,14],[6,25],[1,26],[9,36],[4,38],[12,48],[1,47],[-6,51],[-15,49],[-9,41],[-12,39],[-6,31],[-9,27],[-5,19],[-8,17]]);
  shape(ctx, "#42605b", x - 6, top + 5, [[drift,0],[2,12],[-3,12],[3,23],[-3,23],[2,29],[-8,27],[-4,21],[-7,20],[-3,13],[-6,14]]);
  rect(ctx, "#658373", x + drift - 4, top + 12, 2, 3);
  rect(ctx, "#52766a", x - 13, top + 32, 5, 2);
  rect(ctx, "#557468", x - 15, top + 44, 7, 2);
  rect(ctx, "#69806e", x - 8, top + 32, 3, 1);
  rect(ctx, "#3d5953", x + 3, top + 44, 8, 2);
  rect(ctx, "#385752", x + 4, top + 54, 8, 1);
  for (let cluster = 0; cluster < 15; cluster += 1) {
    const seed = noise(x + cluster * 7, y, variation);
    const dy = 14 + seed % 39;
    const spread = Math.floor(dy / 4) - 2;

  }
}

  const eave = y+height;

  const topRight = [33,31,19,30][style];
  for (let row=0;row<height;row+=1) {
    const course=Math.floor(row/8);
    const left=Math.max(0,topLeft-course*(style===1?2:5));
    const right=width-Math.max(0,topRight-course*(style===1?4:5));
    rect(ctx,edge,x+left,y+row,right-left,1);
    if (row%8>5 || right-left<12) continue;
    rect(ctx,row%8===0 ? rim : base,x+left+2,y+row,right-left-4,1);
    for (let seam=left+4+(course%2)*6;seam<right-9;seam+=13) {
      rect(ctx,row%8===1?bright:dark,x+seam,y+row,row%8===1?8:1,1);

  }
  rect(ctx,rim,x+topLeft+2,y+1,width-topLeft-topRight-4,2);
  rect(ctx,edge,x-1,eave-5,width+2,8);
  rect(ctx,bright,x,eave-4,width,2);

}

  rect(ctx, cloth[0], x - 2, y, 67, 11);
  for (let stripe = 5; stripe < 63; stripe += 14) {
    rect(ctx, cloth[1], x + stripe, y, 6, 10);
    rect(ctx, cloth[2], x + stripe, y + 9, 6, 4);
  }
  rect(ctx, cloth[3], x - 2, y, 65, 2);
  rect(ctx, "#6f4b45", x, y + 11, 65, 2);
  rect(ctx, "#e1a75f", x + 13, y + 14, 8, 4);
  rect(ctx, "#67805b", x + 24, y + 15, 10, 3);
  rect(ctx, "#c96a55", x + 44, y + 14, 6, 4);
  rect(ctx, "#eebf82", x + 14, y + 14, 4, 1);
  rect(ctx, "#91a167", x + 25, y + 15, 5, 1);
}

function well(ctx, x, y) {
  oval(ctx, "#27313a", x, y + 3, 26, 14);
  shape(ctx, "#786d5d", x, y, [[-24,-12],[-16,-22],[12,-22],[22,-14],[25,-2],[21,6],[13,12],[-14,12],[-23,4]]);
  oval(ctx, "#92927b", x, y - 9, 21, 12);
  oval(ctx, "#4d5455", x, y - 9, 16, 8);
  oval(ctx, "#274453", x - 2, y - 9, 13, 6);
  rect(ctx, "#6a8583", x - 8, y - 8, 13, 1);
  rect(ctx, "#8a6f57", x - 19, y - 48, 4, 39);
  rect(ctx, "#8a6f57", x + 17, y - 48, 4, 38);
  rect(ctx, "#4b3c38", x - 15, y - 47, 1, 36);
  rect(ctx, "#bea178", x - 20, y - 49, 41, 4);
  rect(ctx, "#6d5547", x - 20, y - 45, 41, 2);
  rect(ctx, "#a28b69", x - 1, y - 45, 2, 24);
  rect(ctx, "#966b4f", x - 5, y - 22, 11, 8);
  rect(ctx, "#b68763", x - 5, y - 23, 11, 2);
  rect(ctx, "#4b5151", x - 2, y + 1, 2, 7);
  rect(ctx, "#4b5151", x + 13, y - 1, 2, 6);
}

function fence(ctx, x, y, width) {
  rect(ctx, "#202d35", x, y + 4, width, 3);
  rect(ctx, "#705a49", x, y - 6, width, 3);
  rect(ctx, "#4c4040", x, y, width, 3);
  rect(ctx, "#9b7959", x, y - 7, width, 1);
  for (let col = 1; col < width; col += 13) {
    rect(ctx, "#423736", x + col, y - 13, 5, 19);
    rect(ctx, "#a17e5a", x + col, y - 13, 4, 3);
    rect(ctx, "#775b46", x + col, y - 10, 2, 15);
  }
}

function basalt(ctx, x, y, width, height, seed) {
  const silhouette = [[0,3],[3,0],[width-4,0],[width-1,2],[width-1,height-3],
    [width-3,height-1],[2,height-1],[0,height-3]];
  shape(ctx, "#30343e", x + 1, y + 2, silhouette);
  const faces = ["#5a5a62", "#666169", "#545963", "#5b5e68"];
  shape(ctx, faces[seed % faces.length], x, y, silhouette);
  rect(ctx, "#777078", x + 4, y + 1, Math.max(1, width - 8), 1);
  rect(ctx, "#41444f", x + 3, y + height - 2, width - 6, 1);
  rect(ctx, "#777478", x + 2 + seed % Math.max(1, width - 7), y + 3, 3, 1);
  if (seed % 4 === 1) {
    rect(ctx, "#424953", x + width - 6, y + 4, 1, height - 7);
    rect(ctx, "#535752", x + width - 8, y + height - 3, 4, 1);
  }
}

const sameStone = new Set(["c", "d"]);
const terrainColor = {
  f: "#283b43", g: "#3b4c48", p: "#655f55", c: "#635b53", d: "#635b53",
  w: "#284b5d", t: "#405052", k: "#2e3b49", S: "#59606a", "=": "#84674f",
  m: "#46515c", G: "#435650", H: "#414039", B: "#2d3a3c", r: "#38484a",
};

function tileTop(col, row) {
  return [LEFT + col * SIZE, TOP + row * SIZE];
}

function scatterTile(ctx, x, y, seed, colors, count, span = 4) {
  for (let i = 0; i < count; i += 1) {
    const value = noise(seed % 613, i, 221);
    const px = 1 + (value >>> 4) % (SIZE - 2 - span);
    const py = 1 + (value >>> 16) % (SIZE - 3);
    rect(ctx, colors[value % colors.length], x + px, y + py, 1 + value % span, 1);
  }
}

function cobbleTile(ctx, x, y, row, col) {
  for (let line = 0; line < 6; line += 1) {
    const offset = (row * 6 + line) % 2 * 8;
    const ly = y + line * 8;
    rect(ctx, "#4a4847", x, ly + 7, SIZE, 1);
    for (let cell = -offset; cell < SIZE; cell += 16) {
      const seed = noise(col * 3 + Math.floor((cell + offset) / 16), row * 6 + line, 451);
      const left = Math.max(0, cell);
      const right = Math.min(SIZE, cell + 15);
      const tone = ["#655d53","#676059","#625b53","#6a6055","#605a52"][seed % 5];
      rect(ctx, tone, x + left, ly, right - left, 7);
      rect(ctx, "#7c6e61", x + left + 1, ly, Math.max(0, right - left - 3), 1);
      if (right < SIZE) rect(ctx, "#514d4a", x + right, ly + 1, 1, 5);
      if (seed % 5 === 0 && right - left > 6) rect(ctx, "#4e4a47", x + left + 4, ly + 4, 3, 1);
    }
  }
}

function stoneChip(ctx, x, y, width, seed) {
  const rise = 1 + seed % 3;
  const depth = 4 + (seed >>> 11) % 4;
  shape(ctx, "#55575a", x, y, [[1,1],[5,0],[width-1,rise],[width+1,depth-1],[width-4,depth+1],[3,depth],[0,depth-2]]);
  shape(ctx, ["#827a6f","#716b62","#77716a","#7e766c"][seed % 4], x, y, [[1,1],[5,0],[width-2,rise],[width,depth-2],[width-5,depth],[2,depth-1],[0,depth-2]]);
  rect(ctx, "#9b8b786e", x + 4, y + 1, Math.max(1, width - 9), 1);
}

function pathTile(ctx, x, y, grid, row, col, seed) {
  scatterTile(ctx, x, y, seed, ["#88776175","#8b816a65","#544f4888","#74695b","#9a866555"], 44);
  if (seed % 5 !== 1) {
    stoneChip(ctx, x + 4 + seed % 17, y + 6 + seed % 6, 11 + (seed >>> 8) % 9, seed);
    if (seed % 3 === 0) stoneChip(ctx, x + 24, y + 29, 13, seed >>> 2);
    if (seed % 3 === 1) stoneChip(ctx, x + 10, y + 31, 10, seed >>> 3);
  }
  if (seed%11<3) {
    shape(ctx,"#83736058",x+seed%13,y+19,[[0,5],[13,0],[26,1],[29,6],[21,9],[5,10]]);
    rect(ctx,"#b19a7e52",x+seed%13+13,y+22,8,1);
  }
  const isRoad = (dy, dx) => ["p", "S", "=", "g"].includes(grid[row + dy]?.[col + dx]);
  if (!isRoad(0, -1)) {
    rect(ctx, "#544f48", x, y, 3, SIZE);
    rect(ctx, "#80705c", x + 3, y + 1 + seed % 13, 1, 6 + seed % 18);
  }
  if (!isRoad(0, 1)) {
    rect(ctx, "#565449", x + SIZE-3, y, 3, SIZE);
    rect(ctx, "#8b7962", x + SIZE-4, y + 17, 1, 3 + seed % 14);
  }
  if (!isRoad(-1, 0)) rect(ctx, "#514e45", x, y, SIZE, 2);
  if (!isRoad(1, 0)) rect(ctx, "#4f514b", x, y + SIZE-2, SIZE, 2);
}

function waterTile(ctx, x, y, grid, row, col, seed) {
  const isWet = (dy, dx) => ["w", "="].includes(grid[row + dy]?.[col + dx]);
  if (!isWet(0, -1)) {
    rect(ctx, "#4b6969", x, y, 4, SIZE);
    rect(ctx, "#355f67", x + 4, y, 2, SIZE);
  }
  if (!isWet(0, 1)) {
    rect(ctx, "#4b6766", x + SIZE-4, y, 4, SIZE);
    rect(ctx, "#355e65", x + SIZE-6, y, 2, SIZE);
  }
  if (!isWet(-1, 0)) rect(ctx, "#507073", x, y, SIZE, 3);
  if (!isWet(1, 0)) rect(ctx, "#3d6268", x, y + SIZE-3, SIZE, 3);
  for (let i = 0; i < 15; i += 1) {
    const jitter = noise(col, row, i + 15);
    const dx = 4 + (jitter >>> 7) % (SIZE-15);
    const dy = 4 + (jitter >>> 16) % (SIZE-8);
    rect(ctx, ["#355f6b","#376471","#315b6a","#4a7280"][jitter % 4], x + dx, y + dy, 3 + jitter % 7, 1);
  }
  if (seed % 5 === 0) rect(ctx, "#577d85", x + 20, y + 26, 9, 1);
}

function stairTile(ctx, x, y, col, row) {
  for (let step = 0; step < 6; step += 1) {
    const yy = y + step * 8;
    rect(ctx, "#343b48", x, yy + 7, SIZE, 1);
    for (let bx = 0; bx < 3; bx += 1) {
      const seed = noise(col * 3 + bx, row * 6 + step, 731);
      rect(ctx, ["#5b616b","#676670","#625e66","#656875"][seed % 4], x + 16 * bx, yy + 1, 16, 6);
      rect(ctx, "#87817f", x + 16 * bx + 1, yy + 1, 15, 1);
      rect(ctx, "#555661", x + 16 * bx + 14, yy + 2, 2, 4);
      if (seed % 5 < 2) rect(ctx, "#a29380", x + 16 * bx + 6, yy + 2, 3, 1);
    }
  }
}

function ledgeTile(ctx, x, y, seed) {
  rect(ctx, "#546660", x, y, SIZE, 5);
  rect(ctx, "#6f7b6b", x, y, SIZE, 1);
  for (let i = 0; i < 4; i += 1) {
    const offset = i * 12;
    const salt = noise(seed % 387, i, 70);
    const tone = ["#384655","#414c57","#334250","#4c535c"][salt % 4];
    shape(ctx, tone, x + offset, y, [[0,6],[9,4],[12,33],[8,45],[2,41],[0,29]]);
    rect(ctx, "#283746", x + offset, y + 10 + salt % 7, 1, 26);
    rect(ctx, "#59635f", x + offset + 3, y + 6, 5, 1);
    if (salt % 3 === 0) rect(ctx, "#737d6d", x + offset + 2, y + 1, 3, 2);
  }
  rect(ctx, "#233543", x, y + SIZE-2, SIZE, 2);
}

function deckTile(ctx, x, y, row, grid, col) {
  for (let plank = 0; plank < 6; plank += 1) {
    const xx = x + plank * 8;
    const seed = noise(col * 6 + plank, row, 544);
    rect(ctx, ["#9b7958","#967452","#876a50","#927354"][seed % 4], xx, y, 8, SIZE);
    rect(ctx, "#bd9b73", xx + 1, y, 1, SIZE);
    rect(ctx, "#665345", xx + 7, y, 1, SIZE);
    rect(ctx, "#524337", xx + 2, y + 7 + seed % 30, 2, 2);
    if (seed % 4 === 1) rect(ctx, "#705a47", xx + 4, y + 10, 1, 20);
  }
  for (const [neighbor, edge] of [[row - 1, y], [row + 1, y + SIZE-7]]) {
    if (grid[neighbor]?.[col] === "=") continue;
    rect(ctx, "#4c3c34", x, edge, SIZE, 6);
    rect(ctx, "#a7835c", x, edge, SIZE, 2);
    for (const offset of [4, 28]) {
      rect(ctx, "#5f493b", x + offset, edge - 4, 5, 13);
      rect(ctx, "#be996d", x + offset + 1, edge - 4, 3, 2);
    }
    if (col === 9) rect(ctx, "#c8a679", x + 14, edge, 11, 2);
  }
}

function paintTile(ctx, grid, col, row) {
  const type = grid[row][col];
  const [x, y] = tileTop(col, row);
  const seed = noise(col, row, 37);
  rect(ctx, terrainColor[type], x, y, SIZE, SIZE);
  if (sameStone.has(type)) cobbleTile(ctx, x, y, row, col);
  else if (type === "p") pathTile(ctx, x, y, grid, row, col, seed);
  else if (type === "w") waterTile(ctx, x, y, grid, row, col, seed);
  else if (type === "S") stairTile(ctx, x, y, col, row);
  else if (type === "k") ledgeTile(ctx, x, y, seed);
  else if (type === "=") deckTile(ctx, x, y, row, grid, col);
  else if (type === "m") {
    for (let h = 0; h < 4; h += 1) {
      for (let j = 0; j < 3; j += 1) basalt(ctx, x + j * 16, y + h * 12, 16, 11, seed + h + j);
    }
  } else {
    const vegetation = ["#415459","#293e49","#3c514b","#425551","#4c5d55"];
    scatterTile(ctx, x, y, seed, vegetation, type === "B" ? 26 : 49);
    if (type === "g" || type === "t" || type === "G") {
      tuft(ctx, x + 4 + seed % 11, y + 9 + seed % 28, seed, seed % 4 === 1);
      if (seed % 3 === 0) tuft(ctx, x + 27, y + 36, seed >>> 5);
    }
    if (type==="B") {
      if (grid[row-1]?.[col]!=="B") for(let j=0;j<3;j+=1) basalt(ctx,x+j*16,y+1,16,7,seed+j);
      if (grid[row+1]?.[col]!=="B") rect(ctx,"#4c4f47",x,y+SIZE-2,SIZE,2);
    }
  }
}

function paintGrid(ctx, grid) {
  rect(ctx, "#283942", 0, 0, WIDTH, HEIGHT);
  for (let row = 0; row < ROWS; row += 1) {
    for (let col = 0; col < COLS; col += 1) {
      const [x,y] = tileTop(col,row);
      ctx.save();
      ctx.beginPath();
      ctx.rect(x,y,SIZE,SIZE);
      ctx.clip();
      paintTile(ctx,grid,col,row);
      ctx.restore();
    }
  }
}

function goldenFloor(ctx, x, y, rx, ry) {
  oval(ctx, "#b389562c", x, y, rx, ry);
  oval(ctx, "#d49a5223", x, y, rx - 5, ry - 4);
  oval(ctx, "#edb46c20", x - 3, y - 2, rx - 13, ry - 8);
  oval(ctx, "#f5c07b1b", x, y - 3, rx - 20, ry - 12);
}

function forest(ctx, grid, townMode) {
  const props = townMode ? TOWN_CELL_PROPS : ROAD_CELL_PROPS;
  for (let row=0;row<ROWS;row+=1) {
    for (let col=0;col<COLS;col+=1) {
      const cell=grid[row][col];
      if (!["f","t","G"].includes(cell) || props.some(([x,y])=>x===col && y===row)) continue;
      const seed=noise(col,row,52);
      if (seed%8 < (townMode ? 3 : 2)) continue;
      const [x,y]=coordinate(col,row);
      if (cell==="G" || townMode && seed%4===1) broadTree(ctx,x,y,seed);
      else if (seed%5===1) sapling(ctx,x,y,seed);
      else if (seed%6===2 || !townMode && row>=18 && (col+row)%3===1) windsweptPine(ctx,x,y,seed);
      else if (seed%4===2) tree(ctx,x,y,seed);
      else tallPine(ctx,x,y,seed);
    }
  }
}

function lowRoot(ctx, x, y) {
  shape(ctx, "#263437", x, y, [[-12,4],[-6,-2],[3,-4],[16,-2],[29,2],[24,6],[11,4],[0,4],[-10,9]]);
  shape(ctx, "#685c47", x, y, [[-12,4],[-6,-2],[3,-4],[16,-2],[27,1],[13,0],[3,0],[-5,3],[-9,5]]);
  rect(ctx, "#89795c", x + 4, y - 3, 9, 1);
}

function roadGate(ctx) {
  const [x,y]=tileTop(7,3);
  rect(ctx,"#263541",x,y-13,SIZE*3,20);
  for(let i=0;i<9;i+=1) basalt(ctx,x+i*16,y-12-Math.round(Math.sin(i*0.42)*5),16,15,noise(i,y,54));
  rect(ctx,"#a49e88",x+62,y-11,18,3);
  for(const col of [7,9]) {
    const [left,top]=tileTop(col,3);
    rect(ctx,"#263744",left,top+38,SIZE,8);
    rect(ctx,"#67736f",left+2,top+38,SIZE-4,3);
  }
}

function smallGuardhouse(ctx) {
  const [left,top]=tileTop(10,12);
  const x=left+1, y=top+7;
  const width=95;
  rect(ctx,"#2e3439",x,y+15,width,81);
  rect(ctx,"#72634e",x+4,y+34,width-9,51);
  roof(ctx,x,y,width,38,ROOFS[0],1);
  rect(ctx,"#382f31",x+13,y+48,23,37);
  rect(ctx,"#a78056",x+13,y+45,26,3);
  rect(ctx,"#54453a",x+39,y+44,4,41);
  windowFrame(ctx,x+57,y+43);
}

function roadScenery(ctx, grid) {
  forest(ctx,grid,false);
  roadGate(ctx);
  smallGuardhouse(ctx);
  for (const [col,row,scale] of [[1,13,.92],[3,16,.95],[3,20,.8],[4,6,.72],[8,10,.74],[10,19,.85],[2,22,.8],[3,24,.88],[10,18,.62]]) {
    const [x,y]=coordinate(col,row);
    rocks(ctx,x-19,y-22,scale);
  }
  for (const [col,row] of [[3,8],[3,12],[2,18],[3,21],[8,24]]) lowRoot(ctx,...coordinate(col,row));
  sign(ctx,...coordinate(4,14),"route");
  const [x,y]=coordinate(11,13);
  crate(ctx,x-10,y-10);
  for (const [col,row] of ROAD_LAMPS) {
    const [x,y]=coordinate(col,row);
    goldenFloor(ctx,x+4,y-1,57,29);
    lamp(ctx,x,y);
  }
}

function workTable(ctx, x, y) {
  rect(ctx,"#322e33",x,y+12,31,4);
  rect(ctx,"#725344",x+3,y+1,4,15);
  rect(ctx,"#795a46",x+27,y+1,4,15);
  rect(ctx,"#543c39",x,y-4,31,10);
  rect(ctx,"#ba8d60",x,y-6,31,4);
  rect(ctx,"#423f44",x+7,y-10,17,7);
  rect(ctx,"#78838a",x+4,y-12,23,2);
  rect(ctx,"#554c4d",x+26,y-9,4,7);
  rect(ctx,"#ed9b58",x+14,y-12,8,1);
}

function townGate(ctx) {
  const [x,y]=tileTop(4,3);
  const width=4*SIZE;
  rect(ctx,"#392f35",x,y+2,width,18);
  rect(ctx,"#82644e",x,y+1,width,7);
  rect(ctx,"#b28357",x+2,y,width-4,2);
  rect(ctx,"#5f4c44",x+7,y+15,width-14,2);
  for (const col of [3,8]) {
    const [left,top]=tileTop(col,3);
    rect(ctx,"#48515a",left,top+1,SIZE,SIZE-2);
    for (let j=0;j<4;j+=1) basalt(ctx,left+2,top+j*11,SIZE-4,10,noise(col,j,941));
  }
}

function bench(ctx, x, y) {
  const width=27;
  rect(ctx,"#272c33",x-2,y+11,width+4,4);
  rect(ctx,"#4a3937",x+3,y+3,4,11);
  rect(ctx,"#4a3937",x+width-8,y+3,4,11);
  rect(ctx,"#775747",x,y,width,8);
  rect(ctx,"#b68d64",x,y-1,width,2);
  rect(ctx,"#866349",x+1,y+3,width-1,2);
  rect(ctx,"#4f403c",x+1,y+7,width-2,1);
}

function planter(ctx,x,y,color) {
  shape(ctx,"#2b3538",x,y,[[-1,8],[3,4],[16,2],[22,7],[21,14],[15,17],[4,16]]);
  rect(ctx,"#6b5949",x+3,y+7,15,7);
  rect(ctx,"#aa8761",x+2,y+5,18,3);
  rect(ctx,"#5a4d41",x+5,y+12,11,1);
  tuft(ctx,x+6,y+7,noise(x,y),true);
  rect(ctx,color,x+5,y+1,3,2);
  rect(ctx,color,x+12,y+2,2,2);
}

function townScenery(ctx, grid) {
  forest(ctx,grid,true);
  townGate(ctx);
  for (const [col,row,cols,rows,style] of [[1,4,3,4,0],[8,5,3,3,1],[1,17,3,4,2],[9,18,2,3,3]]) {
    const [x,y]=tileTop(col,row);
    house(ctx,x+1,y+rows*SIZE-3,cols*SIZE-2,style);
  }
  for (const [col,row,kind] of [[2,8,"inn"],[9,8,"goods"],[1,21,"forge"],[10,21,"tailor"]]) sign(ctx,...coordinate(col,row),kind);
  const [stallX,stallY]=tileTop(3,10);
  stall(ctx,stallX+13,stallY+7);
  crate(ctx,stallX+73,stallY+22);
  well(ctx,...coordinate(8,10));
  const [tableX,tableY]=tileTop(2,21);
  workTable(ctx,tableX+8,tableY+29);
  for (const [col,row] of [[10,8],[10,12],[10,15],[10,22]]) {
    const [x,y]=tileTop(col,row);
    bench(ctx,x+9,y+25);
  }
  for (const [col,row] of [[3,9],[2,12],[2,22],[10,13]]) {
    const [x,y]=coordinate(col,row);
    crate(ctx,x-10,y-9);
  }
  for (const [col,row] of [[1,9],[4,9],[1,13],[2,15],[1,23],[10,23],[2,24],[10,24]]) {
    const [x,y]=coordinate(col,row);
    planter(ctx,x-10,y-8,["#ab7957","#bc8970","#c5a376"][(col+row)%3]);
  }
  for (const [col,row] of [[1,10],[10,13]]) {
    const [x,y]=coordinate(col,row);
    barrel(ctx,x+8,y-12);
  }
  for (const [col,row] of [[1,24],[9,24]]) {
    const [x,y]=tileTop(col,row);
    fence(ctx,x,y+24,SIZE*2);
  }
  for (const [col,row] of TOWN_LAMPS) {
    const [x,y]=coordinate(col,row);
    goldenFloor(ctx,x+2,y-3,59,32);
    lamp(ctx,x,y);
  }
}

function bankSprite(ctx, sheet, col, row, x, y) {
  if (!sheet?.complete || !sheet.naturalWidth) return;
  ctx.drawImage(sheet, col * 48, row * 60, 48, 60, Math.round(x) - 24, Math.round(y) - 60, 48, 60);
}

function direction(from, to) {
  const dx = to[0] - from[0];
  const dy = to[1] - from[1];
  if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 2 : 1;
  return dy < 0 ? 3 : 0;
}

function stepColumn(elapsed) {
  const phase = Math.max(0, elapsed) % 500;
  if (phase < 150) return 0;
  if (phase < 250) return 1;
  return phase < 400 ? 2 : 1;
}

function lerp(from, to, amount) {
  return from + (to - from) * amount;
}

function drawActivity(ctx,member,x,y,time) {
  const beat=Math.floor(time/120);
  if (member.notice) {
    rect(ctx,"#fce5a3",x-1,y-65,3,6);
    rect(ctx,"#fce5a3",x-1,y-57,3,2);
  }

class Field {
  constructor(mode, bank) {
    this.mode = mode;
    this.bank = bank;
    this.grid = mode === "town" ? TOWN_GRID : ROAD_GRID;
    this.gridBounds = FIELD_GRID;
    this.cellProps = mode === "town" ? TOWN_CELL_PROPS : ROAD_CELL_PROPS;
    this.npcs = (mode === "town" ? TOWN_NPCS : ROAD_NPCS).map(npc => ({ ...npc }));
    this.objects = mode === "town" ? TOWN_OBJECTS : ROAD_OBJECTS;
    this.lamps = mode === "town" ? TOWN_LAMPS : ROAD_LAMPS;
    this.trail = [[5,15],[5,16],[5,17],[5,18]];
    this.facings = [3,3,3,3];
    this.renderedParty = [];
    this.route = [];
    this.turnRoute = [];
    this.heldDirection = null;
    this.steps = 0;
    this.time = 0;
    this.animationStart = 0;
    this.lastStepEnd = -Infinity;
    this.moving = null;
    this.indicator = null;
    this.interacting = null;
    this.lastDistant = null;
    this.routeTarget = null;
    this.interaction = null;
    this.approach = null;
    this.approachPlayed = false;
    this.paused = false;
    this.scene = document.createElement("canvas");
    this.scene.width = WIDTH;
    this.scene.height = HEIGHT;
    const ctx = this.scene.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    paintGrid(ctx,this.grid);
    if (this.mode === "town") townScenery(ctx,this.grid);
    else roadScenery(ctx,this.grid);
    this.ready = true;
  }

  get party() { return this.trail.map(cell => [...cell]); }

  get position() {
    const [col,row] = this.trail[0];
    return { col,row };
  }

  get partyPositions() { return this.trail.map(([col,row])=>({col,row})); }

  gridCell(col,row) { return this.grid[row]?.[col] ?? null; }

  walkable(col,row) {
    if (row < FIRST_PLAYABLE_ROW || row > LAST_PLAYABLE_ROW) return false;
    return WALKABLE.has(this.gridCell(col,row)) &&
      !this.cellProps.some(([x,y])=>x===col && y===row) &&
      !this.npcs.some(npc=>npc.col===col && npc.row===row) &&
      !this.objects.some(object=>object.col===col && object.row===row);
  }

  canStep(trail,next) {
    // The fourth character moves into the third character's former cell at the same time.
    return this.walkable(...next) && !trail.slice(0,3).some(cell=>equal(cell,next));
  }

  findPath(start,end) {
    if (!this.walkable(...end) || equal(start,end)) return [];
    const currentTrail = this.moving?.to ?? this.trail;
    const distance = ([x,y])=>Math.abs(x-end[0])+Math.abs(y-end[1]);
    const queue = [{ trail:currentTrail, path:[], cost:distance(start) }];
    const seen = new Set([currentTrail.flat().join(",")]);
    while (queue.length) {
      const {trail,path}=queue.shift();
      const [x,y]=trail[0];
      if (equal(trail[0],end)) return path;
      for (const [dx,dy] of DIRECTIONS) {
        const next=[x+dx,y+dy];
        if (!this.canStep(trail,next)) continue;
        const shifted=[next,...trail.slice(0,3)];
        const key=shifted.flat().join(",");
        if (seen.has(key)) continue;
        seen.add(key);
        const nextPath=[...path,next];
        const cost=nextPath.length+distance(next);
        const node={trail:shifted,path:nextPath,cost};
        const later=queue.findIndex(entry=>entry.cost>cost);
        if (later<0) queue.push(node);
        else queue.splice(later,0,node);
      }
    }
    return [];
  }

  cancelRoute() {
    this.route=[];
    this.turnRoute=[];
    this.routeTarget=null;
    this.indicator=null;
    this.lastDistant=null;
  }

  setPaused(paused) {
    this.paused=paused;
    if (!paused) return;
    this.heldDirection=null;
    this.cancelRoute();
  }

  setDirection(dx,dy) {
    if (!dx && !dy) {
      this.heldDirection=null;
      this.turnRoute=[];
      return;
    }
    if (this.paused || this.approach || this.interaction) return;
    const next=Math.abs(dx)>Math.abs(dy) ? [Math.sign(dx),0] : [0,Math.sign(dy)];
    if (this.heldDirection && equal(this.heldDirection,next)) return;
    this.cancelRoute();
    this.interacting=null;
    this.heldDirection=next;
  }

  takeInteraction() {
    const request=this.interaction;
    this.interaction=null;
    return request;
  }

  beginConversation(target,source) {
    const [col,row]=this.trail[0];
    this.heldDirection=null;
    this.cancelRoute();
    this.facings[0]=direction([col,row],[target.col,target.row]);
    this.interacting={npc:target,since:this.time};
    return {label:target.label,line:target.pages[0],pages:target.pages,choices:target.choices,source,sheet:target.sheet,icon:target.icon};
  }

  tap(x,y,time=this.time) {
    if (this.paused || this.approach || this.interaction || x<LEFT || x>=LEFT+COLS*SIZE || y<120 || y>=TOP+(LAST_PLAYABLE_ROW+1)*SIZE) return null;
    const destination=tileAt(x,y);
    const clickedPerson=this.npcs.find(npc=>{
      const [cx,feet]=coordinate(npc.col,npc.row);
      return inBox(x-cx,y-feet,[-19,-50,20,8]);
    });
    const clicked=clickedPerson ?? this.objects.find(object=>{
      const [cx,feet]=coordinate(object.col,object.row);
      return inBox(x-cx,y-feet,object.bounds);
    });
    const origin=this.moving?.to[0] ?? this.trail[0];
    const target=clicked ? [clicked.col,clicked.row] : destination;
    const distance=Math.abs(target[0]-origin[0])+Math.abs(target[1]-origin[1]);
    if (clicked && distance===1 && !this.moving) return this.beginConversation(clicked,"tap");
    const choices=clicked ? DIRECTIONS.map(([dx,dy])=>[target[0]+dx,target[1]+dy]) : [target];
    let path=[];
    for (const end of choices) {
      const candidate=this.findPath(origin,end);
      if (candidate.length && (!path.length || candidate.length<path.length)) path=candidate;
    }
    if (!path.length) {
      this.lastDistant=null;
      return null;
    }
    if (distance>1) {
      const last = this.lastDistant;
      const nearbyGround = last && !clicked && !last.object &&
        Math.abs(last.target[0] - target[0]) <= 1 && Math.abs(last.target[1] - target[1]) <= 1;
      const repeated = last && (equal(last.target,target) || nearbyGround) && time-last.at<320;
      if (!repeated) {
        this.lastDistant={target,at:time,object:!!clicked};
        this.indicator={destination:path.at(-1),since:time,preview:true};
        return null;
      }
    }
    this.lastDistant=null;
    this.heldDirection=null;
    this.turnRoute=[];
    this.route=path;
    this.routeTarget=clicked;
    this.interacting=null;
    this.indicator={destination:path.at(-1),since:time,preview:false};
    return null;
  }

  key(key) {
    const facing=["ArrowDown","ArrowLeft","ArrowRight","ArrowUp"].indexOf(key);
    if (facing>=0) this.step(...DIRECTIONS[facing]);
  }

  step(dx,dy) {
    if (this.paused || this.approach || this.interaction || Math.abs(dx)+Math.abs(dy)!==1) return;
    const [col,row]=this.moving?.to[0] ?? this.trail[0];
    const next=[col+dx,row+dy];
    if (!this.walkable(...next)) {
      if (!this.moving) this.facings[0]=direction([col,row],next);
      return;
    }
    this.cancelRoute();
    this.heldDirection=null;
    this.interacting=null;
    this.route=this.findPath([col,row],next);
  }

  startApproach() {
    if (this.mode!=="town" || this.approachPlayed || !equal(this.trail[0],[5,14]) || this.routeTarget) return;
    const npc=this.npcs.find(npc=>npc.approach);
    const start=[npc.col,npc.row];
    const queue=[{cell:start,path:[]}];
    const visited=new Set([start.join(",")]);
    let remaining=[];
    for (let index=0; index<queue.length; index+=1) {
      const {cell,path}=queue[index];
      if (neighbors(cell,this.trail[0])) {
        remaining=path;
        break;
      }
      for (const [dx,dy] of DIRECTIONS) {
        const next=[cell[0]+dx,cell[1]+dy];
        const key=next.join(",");
        if (visited.has(key) || !this.walkable(...next) || this.trail.some(cell=>equal(cell,next))) continue;
        visited.add(key);
        queue.push({cell:next,path:[...path,next]});
      }
    }
    if (!remaining.length) return;
    this.approachPlayed=true;
    this.cancelRoute();
    this.heldDirection=null;
    this.approach={npc,remaining,readyAt:this.time+135,moving:null};
  }

  advanceApproach() {
    const approach=this.approach;
    const {npc}=approach;
    if (approach.moving && this.time>=approach.moving.start+STEP_MS) {
      [npc.col,npc.row]=approach.moving.to;
      approach.moving=null;
    }
    if (approach.moving || this.time<approach.readyAt) return;
    const to=approach.remaining.shift();
    if (to) {
      npc.facing=direction([npc.col,npc.row],to);
      approach.moving={to,start:this.time};
      return;
    }
    this.approach=null;
    this.interaction=this.beginConversation(npc,"approach");
  }

  update(time) {
    this.time=time;
    if (this.paused) return;
    if (this.moving && time>=this.moving.start+STEP_MS) {
      this.trail=this.moving.to;
      this.steps+=1;
      this.moving=null;
      this.lastStepEnd=time;
      this.startApproach();
    }
    if (this.approach) {
      this.advanceApproach();
      return;
    }
    if (this.moving || this.interaction) return;
    if (this.routeTarget && !this.route.length) {
      const target=this.routeTarget;
      this.cancelRoute();
      if (neighbors(this.trail[0],[target.col,target.row])) this.interaction=this.beginConversation(target,"route");
      return;
    }
    let next=this.route.shift();
    if (this.heldDirection) {
      const [col,row]=this.trail[0];
      const wanted=[col+this.heldDirection[0],row+this.heldDirection[1]];
      if (!this.turnRoute.length && this.walkable(...wanted) && !this.canStep(this.trail,wanted)) {
        this.turnRoute=this.findPath(this.trail[0],wanted);
      }
      next=this.turnRoute.shift() ?? wanted;
      if (!this.canStep(this.trail,next)) {
        this.facings[0]=direction(this.trail[0],wanted);
        return;
      }
    }
    if (!next) return;
    if (!this.canStep(this.trail,next)) {
      this.cancelRoute();
      return;
    }
    if (time-this.lastStepEnd>=60) this.animationStart=time;
    const to=[next,...this.trail.slice(0,3)];
    this.facings=to.map((cell,index)=>direction(this.trail[index],cell));
    this.moving={to,start:time};
  }

  draw(ctx,time=0) {
    this.update(time);
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(this.scene,0,0);
    this.sceneryMotion(ctx,time);
    this.drawPeople(ctx,time);
    this.drawIndicator(ctx,time);
  }

  advance(time) { this.update(time); }

  sceneryMotion(ctx,time) {

    }

      const [forgeX,forgeY]=coordinate(3,18);
      for (let i=0;i<5;i+=1) {

        if (phase<8) rect(ctx,"#927a7188",x+2,y+1,3,1);
      }
      return;
    }
    for (let row=0;row<ROWS;row+=1) {
      const water=[];
      for (let col=0;col<COLS;col+=1) if (this.gridCell(col,row)==="w") water.push(col);
      if (!water.length) continue;
      const seed=noise(row,37,23);
      const col=water[(seed+Math.floor(beat/5))%water.length];
      const [left,top]=tileTop(col,row);
      const x=left+5+((seed>>>11)+beat)%(SIZE-17);
      const y=top+4+(seed+beat*3)%(SIZE-10);
      rect(ctx,"#7ca5a268",x,y,6+seed%5,1);
      if (seed%3===1) rect(ctx,"#9aada27c",x+2,y,3,1);
    }
  }

  drawPeople(ctx,time) {
    const cast=this.npcs.map(npc=>{
      let [x,y]=coordinate(npc.col,npc.row);
      const talking=this.interacting?.npc===npc && (this.paused || time-this.interacting.since<2500);
      const facing=talking ? direction([npc.col,npc.row],this.trail[0]) : npc.facing;
      const movement=this.approach?.npc===npc ? this.approach.moving : null;
      let col=STAND;
      if (movement) {
        const [tx,ty]=coordinate(...movement.to);
        const amount=Math.min(1,(time-movement.start)/STEP_MS);
        x=lerp(x,tx,amount);
        y=lerp(y,ty,amount);
        col=stepColumn(time-this.approach.readyAt);
      }
      return {x,y,facing,col,sheet:this.bank.npcs?.[npc.sheet],activity:npc.activity,talking,notice:this.approach?.npc===npc && !movement};
    });
    const amount=this.moving ? Math.min(1,(time-this.moving.start)/STEP_MS) : 0;
    const party=this.trail.map((cell,index)=>{
      const [sx,sy]=coordinate(...cell);
      const [tx,ty]=this.moving ? coordinate(...this.moving.to[index]) : [sx,sy];
      const x=Math.round(lerp(sx,tx,amount));
      const y=Math.round(lerp(sy,ty,amount));
      const col=this.moving ? stepColumn(time-this.animationStart+index*250) : STAND;
      return {x,y,facing:this.facings[index],col,sheet:this.bank.people?.[index],index};
    });
    this.renderedParty=party.map(({x,y,index})=>({x,y,index}));
    cast.push(...party);
    cast.sort((a,b)=>a.y-b.y || (b.index??9)-(a.index??9));
    for (const member of cast) {
      if (!member.sheet) continue;
      const x=Math.round(member.x);

      bankSprite(ctx,member.sheet,member.col,member.facing,x,y);
      drawActivity(ctx,member,x,y,time);
    }
  }

  drawIndicator(ctx, time) {
    if (!this.indicator || time - this.indicator.since > 830) return;
    const [x, feet] = coordinate(...this.indicator.destination);
    const y = feet - 9;
    if (this.indicator.preview) {

    }
    const tint = time - this.indicator.since > 450 ? "#eac5955e" : "#eac595ba";
    for (const [dx, dy, sx, sy] of [[-11,-9,1,1],[10,-9,-1,1],[-11,8,1,-1],[10,8,-1,-1]]) {
      rect(ctx, tint, x + dx, y + dy, sx * 5, 1);
      rect(ctx, tint, x + dx, y + dy, 1, sy * 4);
    }
  }
}

  const gap = Math.max(3, Math.floor((WIDTH - totalWidth) / (sprites.length + 1)));

    const place = { left, x: left + Math.floor(sprite.width / 2), width: sprite.width, height: sprite.height };

      target.hp += amount;
      notice(event, 'party', event.target, `+${amount}`, 'heal');
      if (event.kind === 'revive') {
        notice(event, 'party', event.target, '復活', 'revive', 18);
        event.result = `${names[event.target]}が立ち上がった`;
      } else {
        event.result = `${names[event.target]}のHPが${amount}回復`;
      }
    } else {
      const targets = event.kind === 'fire' ? [0, 1, 2] : [event.target];
      const defeated = [];
      for (const index of targets) {
        const target = foes[index];
        if (target.hp <= 0) continue;
        const damage = Math.min(Math.round(event.power * (event.critical ? 1.5 : 1)), target.hp);
        target.hp -= damage;
        if (target.hp === 0) {
          target.defeatedAt = event.impact;
          defeated.push(FOE_NAMES[index]);
        }
        notice(event, 'foes', index, String(damage), event.critical ? 'critical' : 'damage');
        if (event.critical) notice(event, 'foes', index, '会心！', 'criticalState', 20);
        if (targets.length === 1) event.result = `${FOE_NAMES[index]}に${damage}ダメージ`;
      }
      if (defeated.length) {
        event.result = (defeated.length === 1 ? defeated[0] : '魔物たち') + 'は倒れた！';
      } else if (event.kind === 'fire') {
        event.result = '炎が魔物たちを包んだ';
      }
    }

    events.push(event);
    snapshot(event.impact);
  }
  return { frames, events, notices };
}

function rect(ctx, color, x, y, w, h) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

// Fill whole pixels so mountain ridges and edges use the same grid as the sprites.
function polygon(ctx, color, points) {
  const minY = Math.max(0, Math.floor(Math.min(...points.map(point => point[1]))));
  const maxY = Math.min(ctx.canvas.height - 1, Math.ceil(Math.max(...points.map(point => point[1]))));
  ctx.fillStyle = color;
  for (let y = minY; y <= maxY; y++) {
    const scan = y + 0.5;
    const crossings = [];
    for (let i = 0; i < points.length; i++) {
      const [ax, ay] = points[i];
      const [bx, by] = points[(i + 1) % points.length];
      if ((ay <= scan && by > scan) || (by <= scan && ay > scan)) {
        crossings.push(ax + ((scan - ay) * (bx - ax)) / (by - ay));
      }
    }
    crossings.sort((a, b) => a - b);
    for (let i = 0; i < crossings.length; i += 2) {
      const left = Math.ceil(crossings[i] - 0.5);
      const right = Math.ceil(crossings[i + 1] - 0.5);
      ctx.fillRect(left, y, right - left, 1);
    }
  }
}

function line(ctx, color, ax, ay, bx, by, width = 1) {
  ax = Math.round(ax);
  ay = Math.round(ay);
  bx = Math.round(bx);
  by = Math.round(by);
  const dx = Math.abs(bx - ax);
  const dy = -Math.abs(by - ay);
  const sx = ax < bx ? 1 : -1;
  const sy = ay < by ? 1 : -1;
  let error = dx + dy;
  ctx.fillStyle = color;
  while (true) {
    ctx.fillRect(ax, ay, width, width);
    if (ax === bx && ay === by) break;
    const doubled = error * 2;
    if (doubled >= dy) { error += dy; ax += sx; }
    if (doubled <= dx) { error += dx; ay += sy; }
  }
}

function oval(ctx, color, x, y, rx, ry) {
  ctx.fillStyle = color;
  for (let offset = -ry; offset <= ry; offset++) {
    const wide = Math.floor(rx * Math.sqrt(1 - (offset / ry) ** 2));
    ctx.fillRect(x - wide, y + offset, wide * 2 + 1, 1);
  }
}

function random(seed) {
  return () => {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  };
}

function pine(ctx, x, y, height, colors, seed) {
  const rand = random(seed);
  const trunk = Math.max(1, Math.round(height / 22));
  const top = y - height;
  rect(ctx, colors[0], x - 1, top + 6, trunk + 1, height - 6);
  rect(ctx, colors[1], x + trunk - 1, top + 15, 1, height - 15);
  let previous = 0;
  for (let depth = 4; depth < height * 0.91; depth += 4 + Math.floor(rand() * 4)) {
    const cy = top + depth;
    const wing = Math.min(23, 2 + Math.floor(depth * (0.16 + rand() * 0.12)));
    const branch = 2 + Math.floor(depth * 0.11);
    const extension = Math.floor(rand() * 4);
    polygon(ctx, colors[0], [
      [x, cy - 7], [x + 4, cy - 2], [x + wing, cy + branch - 2],
      [x + wing + extension, cy + branch], [x + wing - 3, cy + branch + 1],
      [x + 2, cy + 2], [x - 3, cy + 4], [x - wing - 2, cy + branch + 1],
      [x - wing + 1, cy + branch - 2], [x - 4, cy - 1],
    ]);
    line(ctx, colors[2], x + 1, cy, x + wing - 1, cy + branch - 2);
    line(ctx, colors[1], x - 3, cy + 1, x - wing + 1, cy + branch - 1);
    if (wing > 7) {
      rect(ctx, colors[2], x + wing - 3, cy + branch + 1, 3, 1);
      rect(ctx, colors[0], x - wing + 2, cy + branch + 2, 3, 1);
      if (previous > 4) rect(ctx, colors[1], x + 4, cy + 4, 3, 1);
    }
    previous = wing;
  }
}

function stone(ctx, x, y, w, h, colors, rand) {
  const [lit, base, shade, highlight] = colors;
  const notch = rand() > 0.55 ? 2 : 1;
  polygon(ctx, shade, [[x+2,y],[x+w-2,y],[x+w,y+2],[x+w-1,y+h-1],[x+w-4,y+h],[x+1,y+h-1],[x-1,y+notch+1]]);
  polygon(ctx, base, [[x+2,y],[x+w-2,y],[x+w-1,y+2],[x+w-2,y+h-2],[x+3,y+h-1],[x,y+h-3],[x,y+notch]]);
  polygon(ctx, lit, [[x+2,y+1],[x+w-3,y],[x+w-2,y+2],[x+w-5,y+Math.max(2,h-3)],[x+2,y+Math.max(2,h-2)],[x,y+notch]]);
  if (w > 7) rect(ctx, highlight, x + 3, y + 1, w - 6, 1);
  if (w > 9 && h > 4) {
    const hairline = x + 4 + Math.floor(rand() * (w - 8));
    rect(ctx, base, hairline, y + 2, Math.min(5, x + w - hairline - 1), 1);
    rect(ctx, highlight, x + w - 5, y + h - 3, 2, 1);
  }
  if (w > 14 && h > 6) {
    rect(ctx, shade, x + 3, y + h - 2, 3 + Math.floor(rand() * 3), 1);
    rect(ctx, base, x + w - 8, y + 3, 3, 2);
  }
}

function grass(ctx, x, y, color, high, height) {
  line(ctx, color, x, y, x - 4, y - height + 2);
  line(ctx, high, x + 1, y, x + 2, y - height);
  line(ctx, color, x + 3, y, x + 6, y - height + 2);
  rect(ctx, color, x - 2, y, 8, 1);
}

function path(ctx) {
  const rand = random(16637);
  polygon(ctx, '#25363e', [[0,183],[32,171],[79,156],[133,158],[166,167],[201,178],[201,437],[0,437]]);
  polygon(ctx, '#252f3a', [[0,221],[30,185],[76,166],[120,165],[163,176],[184,195],[201,228],[201,437],[0,437]]);
  oval(ctx, '#37414c', 103, 212, 93, 45);
  let y = 171;
  let row = 0;
  while (y < HEIGHT) {
    const spread = y - 171;
    const h = 4 + Math.floor(spread / 37);
    const minWidth = 6 + Math.floor(spread / 28);
    const maxWidth = 13 + Math.floor(spread / 12);
    const left = Math.max(-17, 47 - Math.floor(spread / 1.9));
    const right = Math.min(217, 152 + Math.floor(spread / 1.8));
    let x = left - (row % 2 === 0 ? 3 : 6);
    while (x < right) {
      const width = minWidth + Math.floor(rand() * (maxWidth - minWidth));
      const vertical = Math.floor(rand() * (h > 7 ? 3 : 2));
      const warm = x > 143 && y < 224 && rand() < 0.42;
      const colors = PATH_COLORS[warm ? 5 : Math.floor(rand() * 5)];
      stone(ctx, x, y + vertical, width, h - vertical + 1, colors, rand);
      if (rand() < 0.30 && h > 4) {
        rect(ctx, '#4d5749', x + width - 3, y + h - 1, 4, 1);
        if (rand() < 0.35) rect(ctx, '#6a654e', x + width - 2, y + h - 2, 2, 1);
      }
      x += width + Math.floor(rand() * 3);
    }
    row++;
    y += h + 1;
  }
  for (let i = 0; i < 112; i++) {
    const ys = 179 + Math.floor(rand() * 252);
    const side = rand() < 0.49;
    const xs = (side ? -2 : 178) + Math.floor(rand() * (side ? 25 : 24));
    const hs = 3 + Math.floor(rand() * 8);
    if (i % 3 === 0) {
      stone(ctx, xs - 4, ys - 1, 7 + Math.floor(rand() * 13), hs, PATH_COLORS[4], rand);
    } else {
      grass(ctx, xs, ys, '#384836', i % 2 ? '#626348' : '#465d47', hs);
    }
    if (i % 8 === 0) {
      rect(ctx, '#744f47', xs + 2, ys - hs + 2, 2, 2);
      rect(ctx, '#8e654c', xs + 5, ys - hs + 2, 1, 1);
    }
  }
  // A dark, distant foreground keeps the action log and cards readable over the path.
  for (const [top, shade] of [[251, '#141c2925'], [284, '#13192639'], [330, '#11182438'], [413, '#0e172442']]) {
    rect(ctx, shade, 0, top, WIDTH, HEIGHT - top);
  }
}

function fence(ctx) {
  const posts = [
    { x: 3, y: 188, h: 25 }, { x: 26, y: 180, h: 22 },
    { x: 51, y: 175, h: 17 }, { x: 72, y: 173, h: 15 },
    { x: 123, y: 172, h: 17 }, { x: 144, y: 175, h: 18 },
    { x: 166, y: 180, h: 22 }, { x: 187, y: 189, h: 24 },
    { x: 201, y: 198, h: 29 },
  ];
  for (let i = 1; i < posts.length; i++) {
    if (i === 4) continue;
    const left = posts[i-1];
    const right = posts[i];
    for (const lift of [0.31, 0.70]) {
      const ay = left.y-Math.round(left.h*lift);
      const by = right.y-Math.round(right.h*lift);
      const thickness = i > 5 ? 4 : 3;
      const timber = i > 6 ? '#76523d' : '#57423a';
      line(ctx, '#29282f', left.x+2, ay+2, right.x+1, by+2, thickness);
      polygon(ctx, timber, [[left.x+1,ay],[right.x+2,by],[right.x+2,by+thickness],[left.x+1,ay+thickness]]);
      line(ctx, i > 6 ? '#a27551' : '#846851', left.x+2, ay, right.x, by);
      line(ctx, '#453733', left.x+5, ay+2, right.x-3, by+2);
    }
  }
  posts.forEach(({ x, y, h }, i) => {
    const w = i > 5 ? 5 : 4;
    oval(ctx, '#27242d', x+1, y+1, w+2, 2);
    rect(ctx, '#292832', x-1, y-h+1, w+2, h+1);
    rect(ctx, i > 6 ? '#936746' : '#725742', x, y-h, w, h);
    rect(ctx, '#b0885d', x+1, y-h+2, 1, h-3);
    rect(ctx, '#544034', x+w-1, y-h+1, 1, h-1);
    rect(ctx, '#b28a62', x+1, y-h-1, w-2, 1);
    for (const lift of [0.31, 0.70]) {
      rect(ctx, '#3b3537', x+w-2, y-Math.round(h*lift)+1, 1, 1);
    }
  });
}

function makeScene() {
  const scene = document.createElement('canvas');
  scene.width = WIDTH;
  scene.height = HEIGHT;
  const ctx = scene.getContext('2d');
  mountains(ctx);
  path(ctx);
  ctx.save();
  ctx.translate(6, 56);
  shack(ctx);
  ctx.restore();
  const night = ['#192a32','#344443','#41544e'];
  const deep = ['#11212a','#243439','#354749'];
  pine(ctx, 2, 180, 152, deep, 21);
  pine(ctx, 43, 171, 102, night, 716);
  pine(ctx, 64, 172, 75, deep, 322);
  pine(ctx, 136, 171, 61, night, 56);
  pine(ctx, 162, 180, 99, night, 514);
  pine(ctx, 199, 187, 132, deep, 270);
  fence(ctx);
  const rand = random(333);
  for (let i = 0; i < 23; i++) {
    const x = 175 + Math.floor(rand() * 29);
    const y = 184 + Math.floor(rand() * 19);
    rect(ctx, rand() < 0.5 ? '#77644d' : '#956d4a', x, y, 1 + Math.floor(rand() * 2), 1);

}

const darkenedFrames = new WeakMap();

function drawActorFrame(ctx, sheet, sx, sy, x, y, knockedOut) {
  if (!sheet) return;
  if (!knockedOut) {
    ctx.drawImage(sheet, sx, sy, 48, 60, x, y, 48, 60);
    return;
  }

  let sheetFrames = darkenedFrames.get(sheet);
  if (!sheetFrames) {
    sheetFrames = new Map();
    darkenedFrames.set(sheet, sheetFrames);
  }
  const key = sy * 144 + sx;
  let frame = sheetFrames.get(key);
  if (!frame) {
    frame = document.createElement('canvas');
    frame.width = 48;
    frame.height = 60;
    const pixels = frame.getContext('2d');
    pixels.imageSmoothingEnabled = false;
    pixels.drawImage(sheet, sx, sy, 48, 60, 0, 0, 48, 60);
    pixels.globalCompositeOperation = 'source-atop';
    rect(pixels, '#090c18ab', 0, 0, 48, 60);
    sheetFrames.set(key, frame);
  }
  ctx.drawImage(frame, x, y);
}

const NOTICE_STYLE = {
  damage: { color: '#fff4df', size: 21 },
  critical: { color: '#ffd785', size: 25 },
  criticalState: { color: '#ffdc8e', size: 13 },
  hurt: { color: '#ffb2a3', size: 20 },
  hurtState: { color: '#ffc4b0', size: 13 },
  heal: { color: '#9ae3a2', size: 20 },

  protect: { color: '#a9e3f5', size: 14 },

};

class Battle {
  constructor(bank) {
    this.bank = bank;
    this.scene = makeScene();
    this.speed = 0;
    this.demo = simulate(bank.members);
    this.enemyPlacement = layoutEnemies(bank.enemies);
    this.setFormation([0, 3, 1, 2]);
    this.reset();
  }

  // The slot order is front left, front right, back left, back right.
  // Actions and character state always retain their original character index.
  setFormation(order) {
    if (!Array.isArray(order) || order.length !== this.bank.members.length ||
      !this.bank.members.every((member, index) => order.includes(index))) return;
    this.formation = order.slice();
    this.cardCenters = [];
    this.formation.forEach((actor, slot) => {
      this.cardCenters[actor] = CARD_LEFT[slot] + CARD_WIDTH / 2;
    });
  }

  reset() {
    this.clock = 0;
    this.previousTime = null;
    this.labels = [];
  }

  tap(x, y) {
    const { x: left, y: top, width, height } = COMMAND;
    if (x < left || x >= left + width || y < top || y >= top + height) return false;
    if (this.clock >= DURATION) return 'road';
    this.speed = (this.speed + 1) % SPEEDS.length;
    return 'speed';
  }

  label(text, x, y, size, color = '#ffebbd', align = 'center', style = {}) {
    this.labels.push({ text, x, y, size, color, align, ...style });
  }

  draw(stage, hud, time = 0) {
    if (this.previousTime === null || time < this.previousTime) this.clock = Math.min(DURATION, time);
    else this.clock = Math.min(DURATION, this.clock + (time - this.previousTime) * SPEEDS[this.speed]);
    this.previousTime = time;
    const phase = this.clock;
    const frame = this.demo.frames.findLast(item => item.at <= phase);
    const event = this.demo.events.find(action => phase >= action.at && phase < action.until);
    const progress = event ? (phase - event.at) / (event.until - event.at) : 0;
    const impact = event && phase - event.impact;
    const showingSkill = event?.active && progress >= 0.24 && progress < 0.83;
    this.labels = [];

    stage.imageSmoothingEnabled = false;
    stage.drawImage(this.scene, 0, 0);
    lantern(stage, Math.floor(phase / 135));
    this.drawFoes(stage, frame.foes, phase, event, progress);
    if (event && impact >= -65 && impact <= 285) this.drawEffect(stage, event, impact);

    hud.clearRect(0, 0, hud.canvas.width, hud.canvas.height);
    hud.imageSmoothingEnabled = false;
    this.drawOrder(hud, event, phase);
    frame.foes.forEach((foe, index) => {
      if (foe.hp > 0 || phase - foe.defeatedAt < 180) {
        const x = toHud(this.enemyPlacement[index].x);
        bar(hud, Math.max(4, Math.min(HUD_WIDTH - 43, x - 19)), toHud(FOE_FEET + 10), 39, foe.hp / foe.maxHp, LIFE);
      }
    });
    this.drawLog(hud, phase);
    this.drawHud(hud, frame.party, phase, event, showingSkill);
    this.drawNotice(phase);
  }

  drawOrder(ctx, event, phase) {
    const events = this.demo.events;
    const current = event ? events.indexOf(event) : events.findIndex(action => action.at > phase);
    if (current < 0 || phase >= VICTORY_AT) return;
    const upcoming = events.slice(current, current + 4);
    const width = 34 + 30 * upcoming.length;
    const left = Math.floor((HUD_WIDTH - width) / 2);
    plaque(ctx, left, 56, width, 30);
    line(ctx, '#c19866', left+10, 64, left+19, 64);
    line(ctx, '#c19866', left+11, 76, left+18, 76);
    line(ctx, '#d6a76c', left+10, 65, left+18, 75);
    line(ctx, '#a47e61', left+18, 65, left+11, 75);
    rect(ctx, '#e3b881', left+13, 69, 3, 3);
    upcoming.forEach((action, position) => {
      const x = left+26+position*30;
      const enemy = action.kind === 'enemy';
      rect(ctx, position === 0 ? '#c59158' : '#594636', x, 59, 26, 24);
      rect(ctx, enemy ? '#4b3343' : '#283649', x+1, 60, 24, 22);
      if (enemy) {
        const foe = this.bank.enemies[action.actor];
        const [sx, sy] = action.actor === 2 ? [3, 11] : [0, 7];
        if (foe) ctx.drawImage(foe, sx, sy, 24, 22, x+1, 60, 24, 22);
      } else {
        frontPortrait(ctx, this.bank.people[action.actor], x+1, 60, 24, 22, 8);
      }
      if (position === 0) rect(ctx, '#f6d28c', x+3, 80, 20, 1);
    });
  }

  drawFoes(ctx, foes, phase, event, progress) {
    foes.forEach((foe, index) => {
      const sprite = this.bank.enemies[index];
      const place = this.enemyPlacement[index];
      const fade = foe.defeatedAt === null ? 1 : Math.max(0, 1 - (phase-foe.defeatedAt)/360);
      if (!sprite || fade <= 0) return;
      const hovering = index === 0 ? -4 + (Math.floor(phase / 155) % 4) : 0;
      const lunging = event?.kind === 'enemy' && event.actor === index;
      const lunge = lunging ? Math.max(0, 6 - Math.round(Math.abs(progress-0.47) * 17)) : 0;
      const struck = event && (event.kind === 'skill' || event.kind === 'cut') &&
        event.target === index && phase >= event.impact && phase < event.impact+135;
      const recoil = struck ? 2 : 0;
      const y = FOE_FEET + hovering + lunge - recoil;
      const shadowRadius = Math.round(sprite.width * 0.34);
      ctx.save();
      ctx.globalAlpha = fade;
      oval(ctx, '#202630', place.x, FOE_FEET + 1, shadowRadius, 4);
      oval(ctx, '#2d303c', place.x, FOE_FEET + 1, Math.max(1, shadowRadius - 4), 2);
      ctx.globalAlpha = fade * (struck ? 0.72 : 1);
      ctx.drawImage(sprite, place.left + recoil, y - sprite.height);
      ctx.restore();
    });
  }

  drawEffect(ctx, event, impact) {
    const target = this.enemyPlacement[event.target];
    if (event.kind === 'skill' || event.kind === 'cut') {
      slash(ctx, target.x + 4 + Math.round(impact / 100), FOE_FEET - Math.floor(target.height / 2), event.kind === 'skill');
    }
    if (event.kind === 'fire') this.enemyPlacement.forEach(({ x, height }) => {
      const y = FOE_FEET - Math.floor(height / 2) - Math.round(impact / 28);
      polygon(ctx, '#984a42', [[x-17,y+12],[x-22,y+3],[x-18,y-8],[x-13,y-3],[x-11,y-14],
        [x-4,y-7],[x+6,y-17],[x+5,y-5],[x+17,y-11],[x+19,y+3],[x+17,y+10],[x+6,y+15],[x-8,y+15]]);
      polygon(ctx, '#f4a45a', [[x-16,y+11],[x-17,y+2],[x-12,y-4],[x-7,y+2],[x-2,y-9],[x+2,y-4],
        [x+9,y-5],[x+14,y+3],[x+13,y+9],[x+7,y+12],[x-8,y+13]]);
      crossedLight(ctx, x + 3, y + 5, '#ffce7c');
      crossedLight(ctx, x - 12, y - 11, '#f38b50');
      rect(ctx, '#ffcf83', x + 13, y - 15, 2, 1);
    });
  }

  drawNotice(phase) {
    const duration = 960;
    const recent = this.demo.notices.filter(item => item.at <= phase && phase < item.at + duration);
    const latestForTarget = new Map();
    for (const item of recent) latestForTarget.set(item.side + item.index, item.at);

    for (const item of recent) {
      if (latestForTarget.get(item.side + item.index) !== item.at) continue;
      const progress = (phase - item.at) / duration;
      const rise = Math.round(14 * (1 - (1 - progress)**3) + 16 * progress);
      const alpha = progress < 0.64 ? 1 : (1-progress)/0.36;
      const { size, color } = NOTICE_STYLE[item.kind];
      const onCard = item.side === 'party';
      const target = this.enemyPlacement[item.index];
      const x = onCard ? this.cardCenters[item.index] : Math.min(HUD_WIDTH - 29, Math.max(29, toHud(target.x)));
      const base = onCard ? 468 : Math.max(146, toHud(FOE_FEET - target.height - 7));
      this.label(item.text, x, base-rise-item.lift, size, color, 'center',
        { alpha, outline: 2.2, outlineColor: '#151522', weight: 900, sans: true });
    }
  }

  drawLog(ctx, phase) {
    const action = this.demo.events.findLast(event => event.at <= phase);
    const finished = phase >= VICTORY_AT;
    const effect = action && phase >= action.impact && action.result;
    plaque(ctx, 16, 370, 270, 41, finished);
    if (finished) {
      this.label('勝利', 151, 390, 16);
      return;
    }
    if (effect) {
      this.label(action.headline, 151, 382, 13, '#ffedc5');
      this.label(effect, 151, 400, 12, '#d4d5ce');
      return;
    }
    this.label(action ? action.headline : '魔物が現れた！', 151, 390, 14);
  }

  drawHud(ctx, party, phase, event, showingSkill) {
    [['前列', 16, '#d6ad75'], ['後列', 157, '#a9bed2']].forEach(([label, left, color]) => {
      rect(ctx, '#242633', left, 482, 129, 15);
      rect(ctx, '#564a42', left, 482, 129, 1);
      rect(ctx, '#4a484a', left + 8, 489, 30, 1);
      rect(ctx, '#4a484a', left + 91, 489, 30, 1);
      this.label(label, left + 64, 489, 10, color);
    });
    this.formation.forEach((actor, slot) => {
      const member = party[actor];
      const acting = event?.actor === actor && event.kind !== 'enemy';
      const usingSkill = acting && showingSkill;
      const knockedOut = member.hp === 0;
      const targeting = event?.target === actor;
      const elapsed = targeting ? phase - event.impact : -1;
      const takingHit = event?.kind === 'enemy' && elapsed >= 0 && elapsed < 180;
      const shift = takingHit ? [3, -3, 2, -2, 1, -1][Math.floor(elapsed / 30)] : 0;
      const x = CARD_LEFT[slot] + shift;
      const recovering = (event?.kind === 'heal' || event?.kind === 'revive') && elapsed >= 0 && elapsed < 210;
      plaque(ctx, x, CARD_TOP, CARD_WIDTH, 75, usingSkill);
      const inside = knockedOut ? '#161d29' : recovering ? '#2a433e' : takingHit ? '#3c2a35' : '#21313d';
      rect(ctx, inside, x+4, CARD_TOP + 3, 54, 60);
      drawActorFrame(ctx, this.bank.people[actor], usingSkill ? 0 : 48, usingSkill ? 240 : 0,
        x+7, CARD_TOP + 3, knockedOut);
      bar(ctx, x+5, CARD_TOP + 63, 52, member.hp/member.maxHp, PARTY_LIFE);
      bar(ctx, x+5, CARD_TOP + 68, 52, member.gauge/100, member.gauge >= 100 ? FULL : GAUGE);
    });
    rect(ctx, '#101821', 0, 574, HUD_WIDTH, 42);
    rect(ctx, '#594735', 0, 574, HUD_WIDTH, 1);
    rect(ctx, '#312e33', 0, 614, HUD_WIDTH, 1);
    rect(ctx, '#242933', 0, 575, HUD_WIDTH, 1);
    const { x, y, width, height } = COMMAND;
    const finished = phase >= DURATION;
    plaque(ctx, x, y, width, height, finished);
    if (finished) {
      line(ctx, '#efc384', 104, 594, 119, 594, 2);
      line(ctx, '#efc384', 104, 594, 111, 588);
      line(ctx, '#efc384', 104, 595, 111, 601);
      this.label('街道へ', 163, 595, 15);
    } else {
      this.label('速度', 127, 595, 15);
      this.label(`${SPEEDS[this.speed]}×`, 182, 595, 15);
    }
  }
}

return Battle;

                outline = 0, outlineColor = "#101523", weight = 600, sans = false } of labels) {
    const family = sans ? '"Noto Sans CJK JP", "Hiragino Kaku Gothic ProN", sans-serif'
      : '"Noto Serif CJK JP", "Hiragino Mincho ProN", "Yu Mincho", serif';
    OUTPUT.font = weight + " " + size * scale + "px " + family;
    OUTPUT.textAlign = align;
    OUTPUT.globalAlpha = alpha;
    if (outline > 0) {
      OUTPUT.lineWidth = outline * scale;
      OUTPUT.strokeStyle = outlineColor;
      OUTPUT.strokeText(text, x * scale, y * scale);
    } else {
      OUTPUT.fillStyle = "#100d17";
      OUTPUT.fillText(text, x * scale, y * scale + 1);
    }
    OUTPUT.fillStyle = color;
    OUTPUT.fillText(text, x * scale, y * scale);
  }
  OUTPUT.globalAlpha = 1;
  OUTPUT.resetTransform();
}

function metal(ctx, left, top, width, height, active = false) {
  const x = fieldPixel(left);
  const y = fieldPixel(top);
  const w = fieldPixel(left + width) - x;
  const h = fieldPixel(top + height) - y;
  fill(ctx, "#151722", x + 4, y + 3, w - 8, h);
  fill(ctx, "#151722", x, y + 6, w, h - 10);
  fill(ctx, active ? "#e2b67a" : "#937052", x + 4, y, w - 8, h);
  fill(ctx, active ? "#e2b67a" : "#937052", x, y + 4, w, h - 8);
  fill(ctx, "#352932", x + 3, y + 3, w - 6, h - 6);
  fill(ctx, active ? "#3a2b35" : "#211f2a", x + 5, y + 5, w - 10, h - 10);
  fill(ctx, active ? "#5b4136" : "#42333a", x + 5, y + 5, w - 10, 1);
  fill(ctx, "#c49a66", x + 6, y, Math.min(12, w - 12), 1);
  fill(ctx, "#604738", x + 7, y + h - 2, w - 14, 1);
  for (const [dx, dy] of [[5, 5], [w - 7, 5], [5, h - 7], [w - 7, h - 7]]) {
    fill(ctx, "#b99160", x + dx, y + dy, 2, 2);
  }
}

function mark(ctx, left, top) {
  const x = fieldPixel(left);
  const y = fieldPixel(top);
  fill(ctx, "#6a513e", x + 3, y, 3, 9);
  fill(ctx, "#a88156", x + 1, y + 2, 7, 5);
  fill(ctx, "#f6d599", x + 3, y + 3, 3, 3);
}

function face(ctx, index, left, top, width = 28, height = 33) {
  const sheet = bank.people[index];
  ctx.drawImage(sheet, 72 - Math.floor(width / 2), 4, width, height, fieldPixel(left), fieldPixel(top), width, height);
}

function icon(ctx, name, left, top) {
  const x = fieldPixel(left);
  const y = fieldPixel(top);
  if (name === "party") {
    for (let k = 0; k < 3; k += 1) {
      const offset = k * 7;
      fill(ctx, "#171521", x + offset, y + offset % 4, 8, 13);
      fill(ctx, "#af8453", x + offset + 1, y + 1 + offset % 4, 6, 11);
      fill(ctx, "#ddd1a4", x + offset + 2, y + 2 + offset % 4, 4, 3);
      fill(ctx, "#7c5847", x + offset + 2, y + 6 + offset % 4, 4, 3);
    }
    return;
  }
  ctx.drawImage(bank.icons[name], x, y);
}

function drawFieldHud(ctx) {
  metal(ctx, 16, 78, 166, 38);
  mark(ctx, 25, 92);
  queueLabel(SCENES[scene], 42, 96, 19);
  for (let index = 0; index < 4; index += 1) {
    const x = 194 + index * 48;
    metal(ctx, x, 76, 42, 49);
    fieldFill(ctx, "#30394a", x + 5, 81, 32, 33);
    face(ctx, FIELD_FORMATION[index], x + 8, 83, 31, 35);
    fieldFill(ctx, "#101b21", x + 5, 115, 32, 5);
    fieldFill(ctx, "#7cac74", x + 6, 116, 30, 3);
    fieldFill(ctx, "#acd196", x + 6, 116, 29, 1);
  }
  for (const item of NAV) {
    metal(ctx, item.x, 752, 118, 54, panel === item.mode);
    fieldFill(ctx, "#2e2731", item.x + 12, 764, 28, 30);
    fieldFill(ctx, "#493943", item.x + 13, 765, 26, 1);
    fieldFill(ctx, "#805e44", item.x + 15, 790, 22, 1);
    icon(ctx, item.mode, item.x + 18, 770);
    queueLabel(item.label, item.x + 49, 778, 16);
  }
}

function panelOptions() {
  return { scene, formation: FIELD_FORMATION, selected };
}

function drawBag(ctx) {
  fieldFill(ctx, "#111421a8", 0, FIELD_SAFE_TOP, WIDTH, FIELD_SAFE_BOTTOM - FIELD_SAFE_TOP);
  metal(ctx, 24, 400, 354, 338);
  icon(ctx, "bag", 43, 422);
  queueLabel("持ち物", 76, 429, 20);
  fieldFill(ctx, "#6f563f", 40, 452, 322, 1);
  const supplies = [
    { icon: "berry", name: "リンゴ", count: "2" },
    { icon: "bread", name: "パン", count: "3" },
    { icon: "herb", name: "薬草", count: "2" },
  ];
  supplies.forEach((item, index) => {
    const y = 474 + index * 66;
    metal(ctx, 42, y, 318, 54, selected === index);
    icon(ctx, item.icon, 59, y + 20);
    queueLabel(item.name, 96, y + 26, 18);
    queueLabel(item.count, 321, y + 26, 16);
  });
}

function pixelDisk(ctx, x, y, radius, color) {
  for (let dy = -radius; dy <= radius; dy += 1) {
    const extent = Math.floor(Math.sqrt(radius * radius - dy * dy));
    fill(ctx, color, x - extent, y + dy, extent * 2 + 1, 1);
  }
}

function drawGuide(ctx) {
  if (gesture?.kind !== "walk" || !gesture.dragging) return;
  const { x, y, knobX, knobY } = gesture;
  const baseX = fieldPixel(x);
  const baseY = fieldPixel(y);
  const noseX = fieldPixel(knobX);
  const noseY = fieldPixel(knobY);
  for (const [radius, color] of [[58,"#141725a0"],[55,"#b0875bb2"],[53,"#171d2ebc"],[47,"#343747ad"]]) {
    pixelDisk(ctx, baseX, baseY, radius, color);
  }
  fill(ctx, "#b897637a", baseX - 25, baseY, 51, 1);
  fill(ctx, "#b897637a", baseX, baseY - 25, 1, 51);
  for (const [radius, color] of [[24,"#100e1ac0"],[21,"#c6a16cd8"],[18,"#594438e8"],[13,"#9d744ed9"],[4,"#f1d5a4e0"]]) {
    pixelDisk(ctx, noseX, noseY, radius, color);
  }
}

function openDialogue(request, time) {
  if (!dialogue.open(request, time)) return;
  stopGesture();
  FIELD.get(scene)?.setPaused(true);
}

function paintLayer(ctx, scale) {
  const canvas = ctx.canvas;
  const physicalDot = scale * dpi;
  OUTPUT.imageSmoothingEnabled = false;
  OUTPUT.drawImage(canvas, 0, 0, canvas.width * physicalDot, canvas.height * physicalDot);
}

function draw(time, withLabels = true) {
  const onBattle = scene === "battle";
  const ctx = onBattle ? BATTLE_CONTEXT : FIELD_CONTEXT;
  const scale = onBattle ? BATTLE_DOT : FIELD_DOT;
  if (onBattle) {
    battle.draw(ctx, BATTLE_HUD_CONTEXT, Math.max(0, time - sceneStarted));
    visibleLabels = battle.labels;
  } else {
    fieldLabels.length = 0;
    const field = FIELD.get(scene);
    field.setPaused(Boolean(panel || dialogue.isOpen));
    field.draw(ctx, time);
    if (field.approach && gesture?.kind === "walk") stopGesture();
    const request = field.takeInteraction();
    if (request) openDialogue(request, time);
    if (panel === "bag") drawBag(ctx);
    if (panel === "map" || panel === "party") {
      fieldLabels.push(...panels.draw(ctx, panel, panelOptions()));
    }
    drawFieldHud(ctx);
    if (dialogue.isOpen) fieldLabels.push(...dialogue.draw(ctx, time));
    drawGuide(ctx);
    visibleLabels = fieldLabels;
  }
  paintLayer(ctx, scale);
  if (onBattle) paintLayer(BATTLE_HUD_CONTEXT, BATTLE_HUD_DOT);
  if (withLabels) drawDisplayLabels(visibleLabels, onBattle ? BATTLE_HUD_DOT : 1);
  if (!paused) requestAnimationFrame(nextFrame);
}

function nextFrame(time) {
  if (!paused) draw(time);
}

function choose(next) {
  if (!["road", "town", "battle"].includes(next)) return;
  stopGesture();
  dialogue.close();
  scene = next;
  panel = null;
  selected = null;
  sceneStarted = performance.now();
  if (scene === "battle") {
    battle.setFormation?.(FIELD_FORMATION);
    battle.reset();
  }
  for (const field of FIELD.values()) {
    field.setDirection(0, 0);
    field.cancelRoute();
  }
  DISPLAY.dataset.scene = scene;
  DISPLAY.setAttribute("aria-label", scene === "battle" ? "通常戦闘" : SCENES[scene]);
}

function selectFormationCard(card) {
  if (selected === card) {
    selected = null;
  } else if (selected === null) {
    selected = card;
  } else {
    [FIELD_FORMATION[selected], FIELD_FORMATION[card]] = [FIELD_FORMATION[card], FIELD_FORMATION[selected]];
    fieldBank.people = FIELD_FORMATION.map(index => bank.people[index]);
    selected = null;
  }
}

function tap(x, y, time) {
  if (dialogue.isOpen) {
    dialogue.tap(x, y);
    if (!dialogue.isOpen) FIELD.get(scene)?.setPaused(false);
    return;
  }
  if (y < FIELD_SAFE_TOP || y >= FIELD_SAFE_BOTTOM) return;
  if (scene === "battle") {
    if (battle.tap(Math.floor(x / BATTLE_HUD_DOT), Math.floor(y / BATTLE_HUD_DOT)) === "road") choose("road");
    return;
  }
  const field = FIELD.get(scene);
  const nav = NAV.find(item => x >= item.x && x < item.x + 118 && y >= 752 && y < 806);
  if (nav) {
    panel = panel === nav.mode ? null : nav.mode;
    selected = null;
    field.setPaused(Boolean(panel));
    return;
  }
  if (panel === "map" || panel === "party") {
    const hit = panels.hit(x, y, panel, panelOptions());
    if (panel === "map" && typeof hit === "string") choose(hit);
    if (panel === "party" && Number.isInteger(hit)) selectFormationCard(hit);
    return;
  }
  if (panel === "bag") {
    if (x >= 42 && x < 360 && y >= 474 && y < 660 && (y - 474) % 66 < 54) {
      selected = Math.floor((y - 474) / 66);
    }
    return;
  }
  if (y < 126 || y >= 748) return;
  const request = field.tap(Math.floor(x / FIELD_DOT), Math.floor(y / FIELD_DOT), time);
  if (request) openDialogue(request, time);
}

function pointerPoint(event) {
  const box = DISPLAY.getBoundingClientRect();
  return {
    x: (event.clientX - box.left) * WIDTH / box.width,
    y: (event.clientY - box.top) * HEIGHT / box.height,
  };
}

function stopGesture() {
  if (gesture?.kind === "walk") FIELD.get(scene)?.setDirection(0, 0);
  if (gesture?.kind === "dialogue") dialogue?.endHold();
  gesture = null;
}

DISPLAY.addEventListener("pointerdown", event => {
  if (!bank || gesture || (event.pointerType === "mouse" && event.button !== 0)) return;
  event.preventDefault();
  const point = pointerPoint(event);
  const time = performance.now();
  const kind = dialogue.isOpen ? "dialogue" : (scene === "battle" || panel) ? "tap" : "walk";
  gesture = { id: event.pointerId, kind, ...point, time, dragging: false };
  if (kind === "dialogue") dialogue.beginHold(time);
  DISPLAY.setPointerCapture(event.pointerId);
});

DISPLAY.addEventListener("pointermove", event => {
  if (gesture?.id !== event.pointerId || gesture.kind !== "walk") return;
  const point = pointerPoint(event);
  const dx = point.x - gesture.x;
  const dy = point.y - gesture.y;
  const distance = Math.hypot(dx, dy);
  if (!gesture.dragging && distance <= 10) return;
  gesture.dragging = true;
  const ratio = Math.min(1, 40 / Math.max(1, distance));
  gesture.knobX = gesture.x + dx * ratio;
  gesture.knobY = gesture.y + dy * ratio;
  if (distance < 12) FIELD.get(scene)?.setDirection(0, 0);
  else FIELD.get(scene)?.setDirection(dx, dy);
});

DISPLAY.addEventListener("pointerup", event => {
  if (gesture?.id !== event.pointerId) return;
  const input = gesture;
  const time = performance.now();
  const { x, y } = pointerPoint(event);
  if (input.kind === "dialogue") {
    const held = dialogue.endHold(time);
    gesture = null;
    if (!held && dialogue.isOpen) tap(x, y, time);
    return;
  }
  stopGesture();
  if (!input.dragging && time - input.time < 400) tap(x, y, time);
});

for (const type of ["pointercancel", "lostpointercapture"]) {
  DISPLAY.addEventListener(type, event => {
    if (gesture?.id === event.pointerId) stopGesture();
  });
}
DISPLAY.addEventListener("contextmenu", event => event.preventDefault());
window.addEventListener("blur", stopGesture);
window.addEventListener("keydown", event => {
  if (!bank) return;
  if (event.key === "Escape") {
    if (scene === "battle") choose("road");
    else { dialogue.close(); panel = null; selected = null; }
  } else if (event.key.startsWith("Arrow") && scene !== "battle" && !panel && !dialogue.isOpen) {
    event.preventDefault();
    FIELD.get(scene).key(event.key);
  }
});

async function loadAsset(relativePath) {
  const img = new Image();
  img.src = ASSET_DATA[relativePath];
  await img.decode();
  return img;
}

async function boot() {
  const loadList = (directory, stem, ids) =>
    Promise.all(ids.map(id => loadAsset(directory + "/" + stem + "_" + String(id).padStart(3, "0") + ".png")));
  const [people, npcs, enemies, icons] = await Promise.all([
    loadList("people", "person", DEMO_PARTY.map(member => member.art)),
    loadList("people", "person", [30, 70, 71, 72, 74, 101, 39, 99]),
    loadList("monsters", "monster", [2, 6, 3]),
    loadList("tools", "tool", [28, 35, 33, 32, 4, 5, 31]),
  ]);
  bank = { members: DEMO_PARTY, people, npcs, enemies, icons: Object.fromEntries(["map", "bag", "berry", "bread", "herb", "bottle", "stone"].map((name, i) => [name, icons[i]])) };
  fieldBank = { ...bank, people: FIELD_FORMATION.map(index => people[index]) };
  FIELD.set("road", new Field("road", fieldBank));
  FIELD.set("town", new Field("town", fieldBank));
  battle = new Battle(bank);
  panels = new Panels(bank);
  dialogue = new Dialogue(bank);
  choose(query.get("scene") || "road");
  DISPLAY.dataset.ready = "true";
  if (query.has("verify")) {
    window.verify = {
      state: () => {
        const field = FIELD.get(scene);
        return {
          scene, panel, dialog: dialogue.state, clock: battle.clock, speed: battle.speed,
          gesture: gesture ? { ...gesture } : null,
          approach: field?.approach ? {
            npc: [field.approach.npc.col, field.approach.npc.row],
            moving: !!field.approach.moving,
          } : null,
          steps: field?.steps ?? null, position: field?.position ?? null,
          width: DISPLAY.width, height: DISPLAY.height, dpi,
          fieldParty: field?.party ?? null, moving: !!field?.moving,
          fieldFormation: [...FIELD_FORMATION],
          battleFormation: scene === "battle" ? [...battle.formation] : null,
          positions: field?.renderedParty ?? null,
          labels: visibleLabels.map(item => item.text),
        };
      },
      fieldGrid: mode => {
        const field = FIELD.get(mode);
        return {
          cells: field.grid,
          bounds: field.gridBounds,
          occupied: [
            ...[...field.npcs, ...field.objects].map(({ col, row, label }) => ({ col, row, label })),
            ...field.cellProps.map(([col, row]) => ({ col, row })),
          ],
          open: Array.from({ length: 27 }, (_, row) =>
            Array.from({ length: 12 }, (_, col) => field.walkable(col, row))),
        };
      },
      freeze: (next, time, options = {}) => {
        paused = true;
        choose(next);
        sceneStarted = 0;
        if (options.panel) panel = options.panel;
        draw(time);
        if (options.walk && next !== "battle") {
          FIELD.get(next).key("ArrowUp");
          draw(time + 1);
          time += 65;
          draw(time);
        }
        return time;
      },
      pixelPlanes: time => {
        draw(time, false);
        const native = (scene === "battle" ? BATTLE_CONTEXT : FIELD_CONTEXT).canvas.toDataURL();
        const hud = scene === "battle" ? BATTLE_HUD_CONTEXT.canvas.toDataURL() : null;
        const display = DISPLAY.toDataURL();
        draw(time);
        return { native, hud, display };
      },
    };
  }
  requestAnimationFrame(nextFrame);
}

boot();

</script>
</body>
</html>
