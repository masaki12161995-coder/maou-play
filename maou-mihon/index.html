function noise(x, y, salt = 0) {
  let value = Math.imul(x + 347, 374761393) + Math.imul(y + 31, 668265263) + Math.imul(salt, 14426957);
  value = Math.imul(value ^ value >>> 13, 1274126177);
  return (value ^ value >>> 16) >>> 0;
}

function rect(ctx, color, x, y, width, height) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), width, height);
}

function shape(ctx, color, x, y, points) {
  const low = Math.min(...points.map(point => point[1]));
  const high = Math.max(...points.map(point => point[1]));
  ctx.fillStyle = color;
  for (let line = low; line <= high; line += 1) {
    const hits = [];
    for (let i = 0; i < points.length; i += 1) {
      const [ax, ay] = points[i];
      const [bx, by] = points[(i + 1) % points.length];
      if ((ay <= line && by > line) || (by <= line && ay > line)) {
        hits.push(ax + (bx - ax) * (line - ay) / (by - ay));
      }
    }
    hits.sort((a, b) => a - b);
    for (let i = 0; i < hits.length; i += 2) {
      const start = Math.floor(hits[i]);
      ctx.fillRect(x + start, y + line, Math.floor(hits[i + 1]) - start + 1, 1);
    }
  }
}

function oval(ctx, color, cx, cy, rx, ry) {
  ctx.fillStyle = color;
  for (let y = -ry; y <= ry; y += 2) {
    const x = Math.round(rx * Math.sqrt(1 - (y / ry) ** 2));
    ctx.fillRect(cx - x, cy + y, x * 2 + 1, 2);
  }
}

function tuft(ctx, x, y, seed, lit = false) {

  const height = 4 + seed % 4;
  rect(ctx, "#1d3036", x, y, 8, 2);
  rect(ctx, colors[0], x + 2, y - height, 1, height);
  rect(ctx, colors[1], x + 4, y - height + 1, 1, height);
  rect(ctx, colors[0], x + 6, y - height + 3, 1, height - 3);
  rect(ctx, colors[1], x, y - 3, 1, 3);
  if (lit) rect(ctx, "#95845f", x + 3, y - height - 2, 2, 2);
}

    rect(ctx, tone[cluster % tone.length], x + dx - 2, top + dy, 2 + seed % 3, 1 + (seed % 5 === 0));
  }
}

function roof(ctx, x, y, width, height, colors) {
  const [edge, base, dark, bright, rim] = colors;
  const points = [[0, height-1],[1,height-10],[11,height-12],[11,height-26],[18,height-29],[18,height-41],[27,height-43],[27,8],[35,8],[35,0],[width-33,0],[width-33,9],[width-25,9],[width-25,25],[width-17,26],[width-17,37],[width-9,39],[width-9,height-11],[width,height-10],[width,height],[0,height]];
  shape(ctx, edge, x, y, points);
  for (let row = 0; row < height - 6; row += 9) {
    const inset = Math.max(2, 33 - Math.floor(row / 7) * 6);
    const rowX = x + inset + (row < 9 ? 3 : 0);
    const rowWidth = width - inset * 2 - (row < 9 ? 4 : 0);
    rect(ctx, base, rowX, y + row + 2, rowWidth, 6);
    rect(ctx, rim, rowX, y + row + 2, rowWidth, 1);
    rect(ctx, dark, rowX, y + row + 7, rowWidth, 2);
    const seam = (row % 18 ? 6 : 0);
    for (let col = seam; col < rowWidth - 10; col += 12) {
      const tint = noise(col, row, x) % 3 === 1 ? bright : rim;
      rect(ctx, tint, rowX + col + 1, y + row + 3, 8, 1);
      rect(ctx, dark, rowX + col + 10, y + row + 3, 1, 5);
    }
  }
  rect(ctx, rim, x + width / 2 - 22, y + 2, 45, 3);
  rect(ctx, edge, x - 2, y + height - 7, width + 5, 8);
  rect(ctx, bright, x - 1, y + height - 6, width + 2, 2);
  rect(ctx, "#302b31", x + 1, y + height - 4, width - 1, 2);
}

function basalt(ctx, x, y, width, height, seed) {

const sameStone = new Set(["c", "d"]);
const terrainColor = {
  f: "#283b43", g: "#3b4c48", p: "#655f55", c: "#635b53", d: "#635b53",
  w: "#284b5d", t: "#405052", k: "#2e3b49", S: "#59606a", "=": "#84674f",
  m: "#46515c", H: "#4d483e", B: "#504a44", r: "#38484a",
};

function tileTop(col, row) {
  return [LEFT + col * SIZE, TOP + row * SIZE];
}

function scatterTile(ctx, x, y, seed, colors, count, span = 4) {
  for (let i = 0; i < count; i += 1) {
    const value = noise(seed % 613, i, 221);
    const px = 1 + (value >>> 4) % (30 - span);
    const py = 1 + (value >>> 16) % 29;
    rect(ctx, colors[value % colors.length], x + px, y + py, 1 + value % span, 1);
  }
}

function cobbleTile(ctx, x, y, row, col) {
  for (let line = 0; line < 4; line += 1) {
    const offset = (row * 4 + line) % 2 * 8;
    const ly = y + line * 8;
    rect(ctx, "#4a4847", x, ly + 7, SIZE, 1);
    for (let cell = -offset; cell < SIZE; cell += 16) {
      const seed = noise(col * 2 + Math.floor((cell + offset) / 16), row * 4 + line, 451);
      const left = Math.max(0, cell);
      const right = Math.min(SIZE, cell + 15);
      const tone = ["#655d53","#676059","#625b53","#6a6055","#605a52"][seed % 5];
      rect(ctx, tone, x + left, ly, right - left, 7);
      rect(ctx, "#7c6e61", x + left + 1, ly, Math.max(0, right - left - 3), 1);
      if (right < SIZE) rect(ctx, "#514d4a", x + right, ly + 1, 1, 5);
      if (seed % 5 === 0 && right - left > 6) rect(ctx, "#4e4a47", x + left + 4, ly + 4, 3, 1);
    }
  }
}

function stoneChip(ctx, x, y, width, seed) {
  const rise = 1 + seed % 3;
  const depth = 4 + (seed >>> 11) % 4;
  shape(ctx, "#55575a", x, y, [[1,1],[5,0],[width-1,rise],[width+1,depth-1],[width-4,depth+1],[3,depth],[0,depth-2]]);
  shape(ctx, ["#827a6f","#716b62","#77716a","#7e766c"][seed % 4], x, y, [[1,1],[5,0],[width-2,rise],[width,depth-2],[width-5,depth],[2,depth-1],[0,depth-2]]);
  rect(ctx, "#9b8b786e", x + 4, y + 1, Math.max(1, width - 9), 1);
}

function pathTile(ctx, x, y, grid, row, col, seed) {
  scatterTile(ctx, x, y, seed, ["#88776175","#8b816a65","#544f4888","#74695b","#9a866555"], 22);
  if (seed % 5 !== 1) {
    stoneChip(ctx, x + 4 + seed % 9, y + 7, 7 + (seed >>> 8) % 9, seed);
    if (seed % 3 === 0) stoneChip(ctx, x + 18, y + 19, 9, seed >>> 2);
  }
  const isRoad = (dy, dx) => ["p", "S", "="].includes(grid[row + dy]?.[col + dx]);
  if (!isRoad(0, -1)) {
    rect(ctx, "#544f48", x, y, 2, SIZE);
    rect(ctx, "#80705c", x + 2, y + 1 + seed % 9, 1, 6 + seed % 10);
  }
  if (!isRoad(0, 1)) {
    rect(ctx, "#565449", x + 30, y, 2, SIZE);
    rect(ctx, "#8b7962", x + 29, y + 11, 1, 3 + seed % 8);
  }
  if (!isRoad(-1, 0)) rect(ctx, "#514e45", x, y, SIZE, 2);
  if (!isRoad(1, 0)) rect(ctx, "#4f514b", x, y + 30, SIZE, 2);
}

function waterTile(ctx, x, y, grid, row, col, seed) {
  const isWet = (dy, dx) => ["w", "="].includes(grid[row + dy]?.[col + dx]);
  if (!isWet(0, -1)) {
    rect(ctx, "#4b6969", x, y, 3, SIZE);
    rect(ctx, "#355f67", x + 3, y, 2, SIZE);
  }
  if (!isWet(0, 1)) {
    rect(ctx, "#4b6766", x + 29, y, 3, SIZE);
    rect(ctx, "#355e65", x + 27, y, 2, SIZE);
  }
  if (!isWet(-1, 0)) rect(ctx, "#507073", x, y, SIZE, 3);
  if (!isWet(1, 0)) rect(ctx, "#3d6268", x, y + 29, SIZE, 3);
  for (let i = 0; i < 9; i += 1) {
    const jitter = noise(col, row, i + 15);
    const dx = 3 + (jitter >>> 7) % 20;
    const dy = 4 + (jitter >>> 16) % 24;
    rect(ctx, ["#355f6b","#376471","#315b6a","#4a7280"][jitter % 4], x + dx, y + dy, 3 + jitter % 5, 1);
  }
  if (seed % 5 === 0) rect(ctx, "#577d85", x + 15, y + 18, 7, 1);
}

function stairTile(ctx, x, y, col, row) {
  for (let step = 0; step < 4; step += 1) {
    const yy = y + step * 8;
    rect(ctx, "#343b48", x, yy + 7, SIZE, 1);
    for (let bx = 0; bx < 2; bx += 1) {
      const seed = noise(col * 2 + bx, row * 4 + step, 731);
      rect(ctx, ["#5b616b","#676670","#625e66","#656875"][seed % 4], x + 16 * bx, yy + 1, 16, 6);
      rect(ctx, "#87817f", x + 16 * bx + 1, yy + 1, 15, 1);
      rect(ctx, "#555661", x + 16 * bx + 14, yy + 2, 2, 4);
      if (seed % 5 < 2) rect(ctx, "#a29380", x + 16 * bx + 6, yy + 2, 3, 1);
    }
  }
}

function ledgeTile(ctx, x, y, seed) {
  rect(ctx, "#546660", x, y, SIZE, 4);
  rect(ctx, "#6f7b6b", x, y, SIZE, 1);
  for (let i = 0; i < 4; i += 1) {
    const offset = i * 8;
    const salt = noise(seed % 387, i, 70);
    const tone = ["#384655","#414c57","#334250","#4c535c"][salt % 4];
    shape(ctx, tone, x + offset, y, [[0,4],[7,3],[8,23],[6,30],[1,28],[0,19]]);
    rect(ctx, "#283746", x + offset, y + 8 + salt % 4, 1, 19);
    rect(ctx, "#59635f", x + offset + 2, y + 5, 4, 1);
    if (salt % 3 === 0) rect(ctx, "#737d6d", x + offset + 2, y + 1, 3, 2);
  }
  rect(ctx, "#233543", x, y + 30, SIZE, 2);
}

function deckTile(ctx, x, y, row, grid, col) {
  for (let plank = 0; plank < 4; plank += 1) {
    const xx = x + plank * 8;
    const seed = noise(col * 4 + plank, row, 544);
    rect(ctx, ["#9b7958","#967452","#876a50","#927354"][seed % 4], xx, y, 8, SIZE);
    rect(ctx, "#bd9b73", xx + 1, y, 1, SIZE);
    rect(ctx, "#665345", xx + 7, y, 1, SIZE);
    rect(ctx, "#524337", xx + 2, y + 7 + seed % 13, 2, 2);
    if (seed % 4 === 1) rect(ctx, "#705a47", xx + 4, y + 11, 1, 13);
  }
  for (const [neighbor, edge] of [[row - 1, y], [row + 1, y + 25]]) {
    if (grid[neighbor]?.[col] === "=") continue;
    rect(ctx, "#4c3c34", x, edge, SIZE, 6);
    rect(ctx, "#a7835c", x, edge, SIZE, 2);
    for (const offset of [4, 20]) {
      rect(ctx, "#5f493b", x + offset, edge - 4, 5, 13);
      rect(ctx, "#be996d", x + offset + 1, edge - 4, 3, 2);
    }
  }
}

function paintTile(ctx, grid, col, row) {
  const type = grid[row][col];
  const [x, y] = tileTop(col, row);
  const seed = noise(col, row, 37);
  rect(ctx, terrainColor[type], x, y, SIZE, SIZE);
  if (sameStone.has(type)) cobbleTile(ctx, x, y, row, col);
  else if (type === "p") pathTile(ctx, x, y, grid, row, col, seed);
  else if (type === "w") waterTile(ctx, x, y, grid, row, col, seed);
  else if (type === "S") stairTile(ctx, x, y, col, row);

function direction(from, to) {
  const dx = to[0] - from[0];
  const dy = to[1] - from[1];
  if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 2 : 1;
  return dy < 0 ? 3 : 0;
}

function stepColumn(elapsed) {
  const phase = Math.max(0, elapsed) % 500;
  if (phase < 150) return 0;
  if (phase < 250) return 1;
  return phase < 400 ? 2 : 1;
}

function lerp(from, to, amount) {
  return from + (to - from) * amount;
}

class Field {

    this.npcs = mode === "town" ? TOWN_NPCS : ROAD_NPCS;
    this.objects = mode === "town" ? TOWN_OBJECTS : ROAD_OBJECTS;
    this.lamps = mode === "town" ? TOWN_LAMPS : ROAD_LAMPS;
    this.cell = [mode === "town" ? 7 : 6, 17];

    this.renderedParty = [];
    this.route = [];
    this.steps = 0;
    this.time = 0;
    this.animationStart = 0;
    this.moving = null;
    this.indicator = null;
    this.interacting = null;

  }

  get party() {
    return [[...this.cell]];
  }

  get position() {
    const [col, row] = this.cell;
    return { col, row };
  }

  get partyPositions() {
    return [this.position];
  }

  gridCell(col, row) {
    return this.grid[row]?.[col] ?? null;
  }

  walkable(col, row) {
    if (col < 0 || col >= COLS || row < FIRST_PLAYABLE_ROW || row > LAST_PLAYABLE_ROW) return false;
    return WALKABLE.has(this.gridCell(col,row)) &&
      !this.cellProps.some(([x,y]) => x === col && y === row) &&
      !this.npcs.some(npc => npc.col === col && npc.row === row) &&
      !this.objects.some(object => object.col === col && object.row === row);
  }

  findPath(start, end) {
    if (!this.walkable(...end) || equal(start, end)) return [];
    const queue = [{ cell: start, path: [] }];
    const seen = new Set([start.join(",")]);
    for (let index = 0; index < queue.length; index += 1) {
      const { cell, path } = queue[index];
      if (equal(cell, end)) return path;
      for (const [dx, dy] of DIRECTIONS) {
        const next = [cell[0] + dx, cell[1] + dy];
        const key = next.join(",");
        if (seen.has(key) || !this.walkable(...next)) continue;
        seen.add(key);
        queue.push({ cell: next, path: [...path, next] });
      }
    }
    return [];
  }

  tap(x, y) {
    if (x < 0 || x >= WIDTH || y < 87 || y > 905) return null;
    const destination = tileAt(x, y);
    const clickedPerson = this.npcs.find(npc => {
      const [cx, feet] = coordinate(npc.col, npc.row);
      return Math.abs(x - cx) <= 15 && y > feet - 40 && y <= feet + 8;
    });
    const clicked = clickedPerson ?? this.objects.find(object => inBox(x,y,object.box));
    const origin = this.moving?.to ?? this.cell;
    const target = clicked ? [clicked.col, clicked.row] : destination;
    const distance = Math.abs(target[0] - origin[0]) + Math.abs(target[1] - origin[1]);
    if (!this.moving && clicked && distance === 1) {
      this.lastDistant = null;
      this.route = [];
      this.interacting = { npc: clicked, since: this.time };
      this.facing = direction(origin, target);
      return { label: clicked.label, line: clicked.line, icon: clicked.icon, sheet: clicked.sheet };
    }
    const choices = clicked ? DIRECTIONS.map(([dx, dy]) => [target[0] + dx, target[1] + dy]) : [target];
    let path = [];
    for (const end of choices) {
      const candidate = this.findPath(origin, end);
      if (candidate.length && (!path.length || candidate.length < path.length)) path = candidate;
    }
    if (!path.length) {
      this.lastDistant = null;
      return null;
    }
    if (distance > 1) {
      const repeated = this.lastDistant && equal(this.lastDistant.target, target) &&
        this.time - this.lastDistant.at <= 320;
      if (!repeated) {
        this.lastDistant = { target, at: this.time };
        this.indicator = { destination: path.at(-1), since: this.time, preview: true };
        return null;
      }
    }
    this.lastDistant = null;
    this.route = path;
    this.interacting = null;
    this.indicator = { destination: path.at(-1), since: this.time, preview: false };
    return null;
  }

  key(key) {
    const facing = ["ArrowDown", "ArrowLeft", "ArrowRight", "ArrowUp"].indexOf(key);
    if (facing < 0) return;
    const [col, row] = this.moving?.to ?? this.cell;
    const [dx, dy] = DIRECTIONS[facing];
    this.tap(...coordinate(col + dx, row + dy));
  }

  advance(time) {
    this.time = time;
    if (this.moving && time >= this.moving.start + STEP_MS) {
      this.cell = this.moving.to;
      this.steps += 1;
      this.moving = null;
    }
    if (!this.moving && this.route.length) {
      if (!this.wasMoving) this.animationStart = time;
      const to = this.route.shift();
      this.moving = { to, start: time };
      this.facing = direction(this.cell, to);
    }
    this.wasMoving = !!this.moving;
  }

  draw(ctx, time = 0) {
    this.advance(time);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(this.scene, 0, 0);
    this.sceneryMotion(ctx, time);
    this.drawPeople(ctx, time);
    this.drawIndicator(ctx, time);
  }

  sceneryMotion(ctx, time) {
    const beat = Math.floor(time / 100);
    for (const [col, row] of this.lamps) {
      const [x,y] = coordinate(col,row);
      const tone = beat % 6 < 2 ? "#ffe6a1" : "#ffd283";
      rect(ctx, tone, x - 1, y - 29, 3, 3);
      if (beat % 7 === 2) rect(ctx, "#b4825538", x + 5, y - 29, 4, 2);
    }
    if (this.mode === "town") {
      for (let i = 0; i < 4; i += 1) {
        const phase = ((beat + i * 4) % 16);
        const x = 145 + (phase % 3) + Math.floor(phase / 3);
        const y = 606 - phase * 2;
        rect(ctx, phase < 6 ? "#83807c64" : "#71858c46", x, y, 2 + Math.floor(phase / 4), 2);
        if (phase < 8) rect(ctx, "#927a7188", x + 2, y + 1, 3, 1);
      }
      const phase = beat % 15;
      if (phase < 6) {
        rect(ctx, "#f8be70", 110 + phase * 2, 730 - phase * 2, 2, 2);
        rect(ctx, "#d87d4b", 105 - phase, 735 - phase, 1, 2);
      }
      return;
    }
    for (let row = 0; row < ROWS; row += 1) {
      const water = [];
      for (let col = 0; col < COLS; col += 1) if (this.gridCell(col,row) === "w") water.push(col);
      if (!water.length) continue;
      const seed = noise(row,37,23);
      const col = water[(seed + Math.floor(beat / 5)) % water.length];
      const [left, top] = tileTop(col,row);
      const x = left + 5 + ((seed >>> 11) + beat) % 15;
      const y = top + 4 + (seed + beat * 3) % 23;
      rect(ctx, "#7ca5a268", x, y, 6 + seed % 5, 1);
      if (seed % 3 === 1) rect(ctx, "#9aada27c", x + 2, y, 3, 1);
    }
    for (let index = 0; index < 5; index += 1) {
      const phase = Math.floor(time / 180);
      const x = (85 + index * 73 + phase) % WIDTH;
      const y = 136 + index * 164 + Math.round(4 * Math.cos(phase));
      rect(ctx, "#a0ac833e", x, y, 2, 1);
    }
  }

  drawPeople(ctx, time) {
    const cast = this.npcs.map(npc => {
      const [x, y] = coordinate(npc.col, npc.row);
      const talking = this.interacting?.npc === npc && time - this.interacting.since < 2500;
      const facing = talking ? direction([npc.col, npc.row], this.cell) : npc.facing;
      const col = !talking && (Math.floor(time / 300) + npc.sheet * 4) % 29 === 10 ? 0 : STAND;
      return { x, y, facing, col, sheet: this.bank.npcs?.[npc.sheet] };
    });
    const [sx, sy] = coordinate(...this.cell);
    let x = sx;
    let y = sy;
    let col = STAND;
    if (this.moving) {
      const [tx, ty] = coordinate(...this.moving.to);
      const amount = Math.min(1, (time - this.moving.start) / STEP_MS);
      x = lerp(sx, tx, amount);
      y = lerp(sy, ty, amount);
      col = stepColumn(time - this.animationStart);
    }
    this.renderedParty = [{ x: Math.round(x), y: Math.round(y), index: 0 }];
    cast.push({ x, y, facing: this.facing, col, sheet: this.bank.people?.[0] });
    cast.sort((a, b) => a.y - b.y);
    for (const member of cast) {
      if (!member.sheet) continue;
      const x = Math.round(member.x);
      const y = Math.round(member.y);
      oval(ctx, "#151f29a6", x + 1, y - 2, 12, 4);
      bankSprite(ctx, member.sheet, member.col, member.facing, x, y);
    }
  }

  drawIndicator(ctx, time) {
    if (!this.indicator || time - this.indicator.since > 830) return;
    const [x, feet] = coordinate(...this.indicator.destination);
    const y = feet - 9;
    if (this.indicator.preview) {
      rect(ctx, "#f2c786ae", x - 5, y + 2, 2, 5);
      rect(ctx, "#f2c786ae", x + 2, y - 2, 2, 5);
      return;
    }
    const tint = time - this.indicator.since > 450 ? "#eac5955e" : "#eac595ba";
    for (const [dx, dy, sx, sy] of [[-11,-9,1,1],[10,-9,-1,1],[-11,8,1,-1],[10,8,-1,-1]]) {
      rect(ctx, tint, x + dx, y + dy, sx * 5, 1);
      rect(ctx, tint, x + dx, y + dy, 1, sy * 4);
    }
  }
}

return Field;

function polygon(ctx, color, points) {

  const sy = ay < by ? 1 : -1;
  let error = dx + dy;
  ctx.fillStyle = color;
  while (true) {
    ctx.fillRect(ax, ay, width, width);
    if (ax === bx && ay === by) break;
    const doubled = error * 2;
    if (doubled >= dy) { error += dy; ax += sx; }
    if (doubled <= dx) { error += dx; ay += sy; }
  }
}

function oval(ctx, color, x, y, rx, ry) {
  ctx.fillStyle = color;
  for (let offset = -ry; offset <= ry; offset++) {
    const wide = Math.floor(rx * Math.sqrt(1 - (offset / ry) ** 2));
    ctx.fillRect(x - wide, y + offset, wide * 2 + 1, 1);
  }
}

function random(seed) {
  return () => {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  };
}

function pine(ctx, x, y, height, colors, seed) {
  const rand = random(seed);
  const trunk = Math.max(1, Math.round(height / 22));
  const top = y - height;
  rect(ctx, colors[0], x - 1, top + 6, trunk + 1, height - 6);
  rect(ctx, colors[1], x + trunk - 1, top + 15, 1, height - 15);
  let previous = 0;
  for (let depth = 4; depth < height * 0.91; depth += 4 + Math.floor(rand() * 4)) {
    const cy = top + depth;
    const wing = Math.min(23, 2 + Math.floor(depth * (0.16 + rand() * 0.12)));
    const branch = 2 + Math.floor(depth * 0.11);
    const extension = Math.floor(rand() * 4);
    polygon(ctx, colors[0], [
      [x, cy - 7], [x + 4, cy - 2], [x + wing, cy + branch - 2],
      [x + wing + extension, cy + branch], [x + wing - 3, cy + branch + 1],
      [x + 2, cy + 2], [x - 3, cy + 4], [x - wing - 2, cy + branch + 1],
      [x - wing + 1, cy + branch - 2], [x - 4, cy - 1],
    ]);
    line(ctx, colors[2], x + 1, cy, x + wing - 1, cy + branch - 2);
    line(ctx, colors[1], x - 3, cy + 1, x - wing + 1, cy + branch - 1);
    if (wing > 7) {
      rect(ctx, colors[2], x + wing - 3, cy + branch + 1, 3, 1);
      rect(ctx, colors[0], x - wing + 2, cy + branch + 2, 3, 1);
      if (previous > 4) rect(ctx, colors[1], x + 4, cy + 4, 3, 1);
    }
    previous = wing;
  }
}

function stone(ctx, x, y, w, h, colors, rand) {
  const [lit, base, shade, highlight] = colors;
  const notch = rand() > 0.55 ? 2 : 1;
  polygon(ctx, shade, [[x+2,y],[x+w-2,y],[x+w,y+2],[x+w-1,y+h-1],[x+w-4,y+h],[x+1,y+h-1],[x-1,y+notch+1]]);
  polygon(ctx, base, [[x+2,y],[x+w-2,y],[x+w-1,y+2],[x+w-2,y+h-2],[x+3,y+h-1],[x,y+h-3],[x,y+notch]]);
  polygon(ctx, lit, [[x+2,y+1],[x+w-3,y],[x+w-2,y+2],[x+w-5,y+Math.max(2,h-3)],[x+2,y+Math.max(2,h-2)],[x,y+notch]]);
  if (w > 7) rect(ctx, highlight, x + 3, y + 1, w - 6, 1);
  if (w > 9 && h > 4) {
    const hairline = x + 4 + Math.floor(rand() * (w - 8));
    rect(ctx, base, hairline, y + 2, Math.min(5, x + w - hairline - 1), 1);
    rect(ctx, highlight, x + w - 5, y + h - 3, 2, 1);
  }
  if (w > 14 && h > 6) {
    rect(ctx, shade, x + 3, y + h - 2, 3 + Math.floor(rand() * 3), 1);
    rect(ctx, base, x + w - 8, y + 3, 3, 2);
  }
}

function path(ctx) {
  const rand = random(16637);
  polygon(ctx, '#253743', [[0,145],[46,135],[116,130],[172,136],[242,144],[242,525],[0,525]]);
  polygon(ctx, '#26323c', [[21,166],[65,139],[124,135],[173,139],[207,152],[242,211],[242,525],[0,525],[0,223]]);
  let y = 137;
  let row = 0;
  while (y < HEIGHT) {
    const spread = y - 137;
    const h = 4 + Math.floor(spread / 42);
    const minWidth = 6 + Math.floor(spread / 32);
    const maxWidth = 15 + Math.floor(spread / 14);
    const left = Math.max(-23, 48 - Math.floor(spread / 2.45));
    const right = Math.min(259, 179 + Math.floor(spread / 2.4));
    let x = left - (row % 2 === 0 ? 3 : 8);
    while (x < right) {
      const width = minWidth + Math.floor(rand() * (maxWidth - minWidth));
      const vertical = Math.floor(rand() * (h > 7 ? 3 : 2));
      const warm = x > 166 && y < 206 && rand() < 0.45;
      const colors = PATH_COLORS[warm ? 5 : Math.floor(rand() * 5)];
      stone(ctx, x, y + vertical, width, h - vertical + 1, colors, rand);
      if (rand() < 0.30 && h > 4) {
        rect(ctx, '#4d5749', x + width - 3, y + h - 1, 4, 1);
        if (rand() < 0.35) rect(ctx, '#6a654e', x + width - 2, y + h - 2, 2, 1);
      }
      x += width + Math.floor(rand() * 3);
    }
    row++;
    y += h + 1;
  }
  for (let i = 0; i < 148; i++) {
    const ys = 147 + Math.floor(rand() * 367);
    const side = rand() < 0.49;
    const xs = (side ? 0 : 218) + Math.floor(rand() * (side ? 31 : 24));
    const hs = 3 + Math.floor(rand() * 9);
    if (i % 3 === 0) {
      stone(ctx, xs - 4, ys - 1, 9 + Math.floor(rand() * 16), hs, PATH_COLORS[4], rand);
    } else {
      grass(ctx, xs, ys, '#384836', i % 2 ? '#626348' : '#465d47', hs);
    }
    if (i % 8 === 0) {
      rect(ctx, '#744f47', xs + 2, ys - hs + 2, 2, 2);
      rect(ctx, '#8e654c', xs + 5, ys - hs + 2, 1, 1);
    }
  }
}

function fence(ctx) {
  const posts = [
    { x: 12, y: 154, h: 23 }, { x: 39, y: 151, h: 21 },
    { x: 64, y: 149, h: 19 }, { x: 89, y: 148, h: 18 },
    { x: 117, y: 149, h: 19 }, { x: 147, y: 153, h: 22 },
    { x: 179, y: 159, h: 25 }, { x: 211, y: 167, h: 30 },
    { x: 240, y: 175, h: 33 },
  ];
  for (let i = 1; i < posts.length; i++) {
    const left = posts[i-1];
    const right = posts[i];
    for (const lift of [0.31, 0.70]) {
      const ay = left.y-Math.round(left.h*lift);
      const by = right.y-Math.round(right.h*lift);
      const thickness = i > 5 ? 4 : 3;
      const timber = i > 6 ? '#76523d' : '#57423a';
      line(ctx, '#29282f', left.x+2, ay+2, right.x+1, by+2, thickness);
      polygon(ctx, timber, [[left.x+1,ay],[right.x+2,by],[right.x+2,by+thickness],[left.x+1,ay+thickness]]);
      line(ctx, i > 6 ? '#a27551' : '#846851', left.x+2, ay, right.x, by);
      line(ctx, '#453733', left.x+5, ay+2, right.x-3, by+2);
    }
  }
  posts.forEach(({ x, y, h }, i) => {
    const w = i > 5 ? 5 : 4;
    oval(ctx, '#27242d', x+1, y+1, w+2, 2);
    rect(ctx, '#292832', x-1, y-h+1, w+2, h+1);
    rect(ctx, i > 6 ? '#936746' : '#725742', x, y-h, w, h);
    rect(ctx, '#b0885d', x+1, y-h+2, 1, h-3);
    rect(ctx, '#544034', x+w-1, y-h+1, 1, h-1);
    rect(ctx, '#b28a62', x+1, y-h-1, w-2, 1);
    for (const lift of [0.31, 0.70]) {
      rect(ctx, '#3b3537', x+w-2, y-Math.round(h*lift)+1, 1, 1);

  });
}

const darkenedFrames = new WeakMap();

function drawActorFrame(ctx, sheet, sx, sy, x, y, knockedOut) {
  if (!sheet) return;
  if (!knockedOut) {
    ctx.drawImage(sheet, sx, sy, 48, 60, x, y, 48, 60);
    return;
  }

  let sheetFrames = darkenedFrames.get(sheet);
  if (!sheetFrames) {
    sheetFrames = new Map();
    darkenedFrames.set(sheet, sheetFrames);
  }
  const key = sy * 144 + sx;
  let frame = sheetFrames.get(key);
  if (!frame) {
    frame = document.createElement('canvas');
    frame.width = 48;
    frame.height = 60;
    const pixels = frame.getContext('2d');
    pixels.imageSmoothingEnabled = false;
    pixels.drawImage(sheet, sx, sy, 48, 60, 0, 0, 48, 60);
    pixels.globalCompositeOperation = 'source-atop';
    rect(pixels, '#090c18ab', 0, 0, 48, 60);
    sheetFrames.set(key, frame);
  }
  ctx.drawImage(frame, x, y);
}

function partyValues(index, phase) {
  const member = PARTY[index];
  let { hp, gauge } = member;
  if (index === 0 && phase >= 810) gauge = phase < 1980 ? 1 : 0.24;
  if (index === 3 && phase >= 3270) {
    hp = phase < 4270 ? 0 : 0.58;
    gauge = phase < 5270 ? 0 : 0.25;
  }
  if (index === 1 && phase >= 4270) gauge = 0.13;
  if (index === 2 && phase >= 6250) gauge = 0.05;
  return { hp, gauge };
}

function enemyValue(index, phase) {
  let hp = FOES[index].hp;
  if (index === 1 && phase >= 810) hp -= 0.12;
  if (index === 1 && phase >= 1930) hp -= 0.43;
  if (index === 2 && phase >= 5270) hp -= 0.22;
  if (index === 0 && phase >= 6250) hp -= 0.25;
  return phase >= 6330 ? 0 : hp;
}

class Battle {
  constructor(bank) {
    this.bank = bank;
    this.scene = makeScene();
    this.speed = 0;
    this.reset();
  }

  reset() {
    this.clock = 0;
    this.previousTime = null;
    this.labels = [];
  }

  tap(x, y) {
    const { x: left, y: top, width, height } = COMMAND;
    if (x < left || x >= left + width || y < top || y >= top + height) return false;
    if (this.clock >= DURATION) return 'road';
    this.speed = (this.speed + 1) % SPEEDS.length;
    return 'speed';

          scene, panel, dialog, clock: battle.clock, speed: battle.speed,
          steps: field?.steps ?? null, position: field?.position ?? null,
          width: DISPLAY.width, height: DISPLAY.height, dpi,
          fieldParty: field?.party ?? null, moving: !!field?.moving,
          fieldFormation: [...FIELD_FORMATION],
          positions: field?.renderedParty ?? null,
          labels: visibleLabels.map(item => item.text),
        };
      },
      fieldGrid: mode => {
        const field = FIELD.get(mode);
        return {
          cells: field.grid,
          bounds: field.gridBounds,
          occupied: [
            ...[...field.npcs, ...field.objects].map(({ col, row, label }) => ({ col, row, label })),
            ...field.cellProps.map(([col, row]) => ({ col, row })),
          ],
          open: Array.from({ length: 32 }, (_, row) =>
            Array.from({ length: 15 }, (_, col) => field.walkable(col, row))),
        };
      },
      freeze: (next, time, walk = false) => {
        paused = true;
        choose(next);
        sceneStarted = 0;
        draw(time);
        if (walk && next !== "battle") {
          FIELD.get(next).key("ArrowUp");
          draw(time + 1);
          time += 65;
          draw(time);
        }
        return time;
      },
      pixelPlanes: time => {
        draw(time, false);
        const native = (scene === "battle" ? BATTLE_CONTEXT : FIELD_CONTEXT).canvas.toDataURL();
        const display = DISPLAY.toDataURL();
        draw(time);
        return { native, display };
      },
    };
  }
  requestAnimationFrame(nextFrame);
}

boot();

</script>
</body>
</html>
