<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#111520">
  <title>魔王は昨日死んだ</title>
  <style>
    :root { color-scheme:dark; background:#111520; }
    * { box-sizing:border-box; }
    html, body { width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none; }
    body { position:fixed;inset:0;display:grid;place-items:center; }
    main { width:min(402px,100vw,calc(100svh * 402 / 874));aspect-ratio:402/874;position:relative; }
    canvas { width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none; }
    #loading { position:absolute;inset:0;display:grid;place-content:center;margin:0;color:#edcda1;font-family:serif;font-size:1rem; }
    #loading[hidden] { display:none; }
  </style>
  <script defer src="data.js"></script>
  <script defer src="models.js"></script>
  <script defer src="fight.js"></script>
  <script defer src="world.js"></script>
  <script defer src="field.js"></script>
  <script defer src="dialogue.js"></script>
  <script defer src="battleview.js"></script>
  <script defer src="ui.js"></script>
  <script defer src="cards.js"></script>
  <script defer src="game.js"></script>
</head>
<body>
  <main>
    <canvas id="screen" aria-label="魔王は昨日死んだ" tabindex="0"></canvas>
    <p id="loading">読み込み中</p>
  </main>
</body>
</html>
