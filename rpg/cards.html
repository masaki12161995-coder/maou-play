<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14111a">
<title>札</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#14111a;--panel:#211b26;--line:#7a5a3e;--gold:#e8c27a;--text:#f2e4cb;--sub:#b9a58c;--me:#3d6fb3;--meL:#7fb0ef;--op:#b2484a;--opL:#f08a7e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;overscroll-behavior:none;touch-action:manipulation}
#app{position:fixed;left:env(safe-area-inset-left);right:env(safe-area-inset-right);top:max(var(--st,0px),env(safe-area-inset-top),52px);bottom:max(var(--sb,0px),env(safe-area-inset-bottom),30px);display:flex;justify-content:center}
.screen{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;padding:8px 10px 10px;gap:8px;position:relative}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.title{font-size:20px;font-weight:700;color:var(--gold);letter-spacing:.1em}
.frame{background:linear-gradient(#2a2230,#1d1722);border:2px solid var(--line);border-radius:6px;box-shadow:0 0 0 2px #0008 inset,0 3px 0 #0006}
.btn{appearance:none;border:2px solid var(--line);background:linear-gradient(#3a2d33,#271e25);color:var(--text);font:inherit;font-size:16px;border-radius:6px;padding:10px 14px;box-shadow:0 3px 0 #0008}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0008}
.btn.gold{border-color:#c79a52;background:linear-gradient(#6a4b2b,#3e2b1b);color:#fff1cf}
.btn.dim{opacity:.45}
.back{width:40px;height:40px;padding:0;font-size:20px}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.sprite{image-rendering:pixelated;background-repeat:no-repeat}
/* card */
.card{position:relative;border-radius:6px;border:2px solid #000a;flex:none}
.card .face,.card .art{overflow:hidden}
.card .face{position:absolute;inset:0;border-radius:4px}
.card.me .face{background:linear-gradient(160deg,#5b8fd6,#2c4f86)}
.card.op .face{background:linear-gradient(160deg,#d86a66,#7c2c33)}
.card.nb .face{background:linear-gradient(160deg,#7d6a58,#4a3c31)}
.card .art{position:absolute;left:6%;right:6%;top:14%;bottom:20%;overflow:hidden;background:radial-gradient(circle at 50% 60%,#ffffff30,#0000 70%)}
.card .art img{position:absolute;left:50%;transform:translateX(-50%);image-rendering:pixelated}
.card .n{position:absolute;font-family:"Avenir Next",system-ui,sans-serif;font-weight:800;color:#fff;text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000;line-height:1;text-align:center}
.card .stars{position:absolute;left:3px;top:2px;color:#ffe08a;font-size:9px;font-weight:800;font-family:"Avenir Next",system-ui,sans-serif;text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000;line-height:1}
.card .qk{position:absolute;left:0;right:0;bottom:0;text-align:center;white-space:nowrap;overflow:hidden;background:#0009;color:#ffe9b8;font-size:9px;padding:1px 0 2px}
.card .shield{position:absolute;right:3px;top:3px;width:12px;height:12px;border-radius:2px;background:#ffe08a;box-shadow:0 0 0 1px #000;display:none}
.card.shielded .shield{display:block}
.card.sel{outline:3px solid #ffe08a;outline-offset:1px;transform:translateY(-8px)}
.card.target::after{content:"";position:absolute;inset:0;border:3px solid #ffe08a;border-radius:4px;box-shadow:0 0 10px #ffe08a inset}
.card.danger::after{content:"";position:absolute;inset:0;border:3px solid #ff5b5b;border-radius:4px;box-shadow:0 0 10px #ff5b5b inset}
.card.used{opacity:.28}
.card.r6{animation:rb 2.4s linear infinite}
@keyframes rb{0%{box-shadow:0 0 0 2px #ff5f5f,0 0 10px #ff5f5f}25%{box-shadow:0 0 0 2px #ffd35a,0 0 10px #ffd35a}50%{box-shadow:0 0 0 2px #5fe08a,0 0 10px #5fe08a}75%{box-shadow:0 0 0 2px #5fa8ff,0 0 10px #5fa8ff}100%{box-shadow:0 0 0 2px #d07bff,0 0 10px #d07bff}}
.card.flip{animation:flip .42s ease}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg) scale(1.06)}100%{transform:rotateY(0)}}
.card.pop{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.mark{position:absolute;font-size:10px;padding:1px 5px;border-radius:8px;font-weight:700;z-index:3;white-space:nowrap}
.mark.t{background:#ffe08a;color:#3a2a10;left:50%;transform:translateX(-50%);bottom:-15px}
.mark.d{background:#ff5b5b;color:#fff;left:50%;transform:translateX(-50%);bottom:-15px}
/* town */
.opp2{display:flex;align-items:center;gap:6px;padding:5px 6px;min-height:72px}
.opp2 .who{width:44px;height:58px;flex:none;position:relative;overflow:hidden}
.opp2 .info{flex:1;min-width:0}
.opp2 .nm{font-size:13px;font-weight:700;line-height:1.25}
.opp2 .sub{font-size:11px;color:var(--sub)}
.opp2.out{opacity:.45}
.book{display:grid;grid-template-columns:repeat(5,1fr);gap:8px 4px;justify-items:center;align-content:start;flex:1}
.bk1{display:flex;flex-direction:column;align-items:center;gap:2px}
.bk1 .no{font-size:10px;color:var(--sub);font-family:"Avenir Next",system-ui,sans-serif}
.card.shadow{background:#0004;border-color:#3a3038;border-style:dashed}
.card.shadow .art img{filter:brightness(0) opacity(.55)}
.card.shadow .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#5a4d52;font-size:22px;font-weight:800}
.pager{display:flex;align-items:center;gap:8px}
.pager .btn{width:52px;padding:10px 0}
.dots{flex:1;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:#4a3d3a}
.dots i.on{background:var(--gold)}
.card.glow{animation:glw 1.6s linear infinite}
@keyframes glw{0%,100%{box-shadow:0 0 0 2px #e8f2ff,0 0 6px #bcd6ff}50%{box-shadow:0 0 0 2px #fff6d0,0 0 14px #ffe9a8}}
.card.glow .face{background:linear-gradient(160deg,#9aa8bd,#4b5566)!important}
.card.sealed .qk{text-decoration:line-through;opacity:.6}
.opp{display:flex;align-items:center;gap:10px;padding:8px}
.opp .who{width:72px;height:90px;flex:none;position:relative;overflow:hidden}
.opp .info{flex:1;min-width:0}
.opp .nm{font-size:17px;font-weight:700}
.opp .sub{font-size:12px;color:var(--sub);margin-top:2px}
.opp .rec{font-size:12px;color:var(--gold);margin-top:4px}
.lbl{font-size:11px;color:var(--sub)}
/* deck */
.row{display:flex;gap:6px;justify-content:center;align-items:flex-end}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;justify-items:center;align-content:start}
.meter{display:flex;align-items:center;gap:8px;justify-content:center;font-size:14px}
.meter b{font-size:18px;color:var(--gold)}
.meter.over b{color:#ff6b6b}
/* board */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;margin:0 auto}
.cell{border-radius:6px;background:#00000040;box-shadow:0 0 0 1px #7a5a3e80 inset;position:relative;display:flex;align-items:center;justify-content:center}
.cell.can{box-shadow:0 0 0 2px #ffe08a inset;background:#ffe08a14}
.score{display:flex;align-items:center;justify-content:space-between;font-size:15px}
.score b{font-family:"Avenir Next",system-ui,sans-serif;font-size:24px}
.msg{min-height:22px;text-align:center;font-size:13px;color:var(--sub)}
.veil{position:absolute;inset:0;background:#0b090fe6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:20}
.big{font-size:30px;font-weight:800;color:var(--gold);letter-spacing:.1em}
.toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:#000c;border:1px solid var(--line);padding:8px 14px;border-radius:6px;font-size:15px;z-index:30;pointer-events:none;animation:fade 1.3s forwards}
@keyframes fade{0%{opacity:0}10%{opacity:1}75%{opacity:1}100%{opacity:0}}
.info2{font-size:12px;color:var(--text);text-align:center;min-height:30px;line-height:1.3}

.board{position:relative}
.toss{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b090fb8;border-radius:6px;z-index:5;perspective:700px;gap:16px}
.coinwrap{animation:hop 1.5s ease-out}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-80px)}78%{transform:translateY(0)}88%{transform:translateY(-12px)}100%{transform:translateY(0)}}
.coin3d{width:112px;height:112px;position:relative;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;animation:spinB 1.5s cubic-bezier(.2,.6,.3,1) forwards}
.coin3d.red{animation-name:spinR}
@keyframes spinB{from{transform:rotateY(0)}to{transform:rotateY(1800deg)}}
@keyframes spinR{from{transform:rotateY(0)}to{transform:rotateY(1980deg)}}
.cf{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:50px;font-weight:900;color:#fff;text-shadow:0 2px 0 #0008;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 0 0 5px #e8c27a inset,0 0 0 8px #6b4a1b inset,0 6px 16px #000a}
.cf.blue{background:radial-gradient(circle at 35% 30%,#cfe3ff,#3d6fb3 55%,#1d3a66 85%)}
.cf.red{background:radial-gradient(circle at 35% 30%,#ffd6d0,#b2484a 55%,#5c1c22 85%);transform:rotateY(180deg)}
.tosstx{font-size:24px;font-weight:800;color:var(--gold);min-height:32px;letter-spacing:.12em}
.panel{border-radius:8px;padding:6px 8px 8px}
.panel.op{background:linear-gradient(#3a1d24,#24141a);box-shadow:0 0 0 1px #8a3a40 inset}
.panel.me{background:linear-gradient(#1b2b44,#121b2b);box-shadow:0 0 0 1px #3a5f99 inset}
.phead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text);margin-bottom:6px;letter-spacing:.05em}
.vsband{display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.vsmid{display:flex;flex-direction:column;align-items:center;gap:2px}
.vs{font-family:"Avenir Next",system-ui;font-weight:900;font-style:italic;font-size:30px;color:var(--gold);text-shadow:0 2px 0 #6b4a1b}
.slot{width:62px;height:80px;border-radius:6px;border:2px dashed #3a5f99;background:#0003}
.wmeter{display:flex;align-items:center;gap:2px}
.wmeter i{width:7px;height:11px;border-radius:2px;background:#ffffff20;display:block}
.wmeter i.on{background:#e8c27a}
.wmeter i.over{background:#ff6b6b}
.wmeter span{margin-left:6px;font-size:13px;color:var(--gold)}
.tray{background:linear-gradient(#211a1f,#171216);box-shadow:0 0 0 1px #5a4030 inset;border-radius:8px;padding:6px 8px;flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tray .info2{min-height:18px;margin-bottom:4px;color:var(--sub)}
.tray .grid{grid-template-columns:repeat(6,1fr);gap:8px 4px}
.card.back{background:repeating-linear-gradient(45deg,#4a1e26 0 6px,#3a161d 6px 12px);border:2px solid #c9a35a;border-radius:6px}
.card.back.lure{animation:lure 1.6s ease-in-out infinite;cursor:pointer}
@keyframes lure{0%,100%{box-shadow:0 0 0 0 #e8c27a00}50%{box-shadow:0 0 10px 2px #e8c27a99}}
.card.back .bk{position:absolute;inset:6px;border:1px solid #c9a35a88;border-radius:4px;display:flex;align-items:center;justify-content:center}
.card.back .bk::after{content:"";width:40%;aspect-ratio:1;transform:rotate(45deg);border:2px solid #e8c27a;background:#2a1016}
.card.back .bk b{position:absolute;color:#ffe08a;font-size:20px;z-index:2}
</style>
</head>
<body>
<div id="app"></div>
<script>
// RPGの中から開いたときは、画面の上下のさわれない所の広さを親からもらう（枠の中では iPhone がこの広さを教えてくれないため）
(function () { const q = new URLSearchParams(location.search), r = document.documentElement.style; if (q.get("st")) r.setProperty("--st", q.get("st") + "px"); if (q.get("sb")) r.setProperty("--sb", q.get("sb") + "px"); })();
</script>
<script src="../cards/cards-data.js?v=3"></script>
<script src="../cards/rules.js?v=3"></script>
<script src="js/cardsapp.js?v=30"></script>
</body>
</html>
