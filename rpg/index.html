<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>戦闘の試作</title>
<style>
html,body{margin:0;height:100%;background:#0b0d14;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{display:flex;align-items:center;justify-content:center;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif;color:#f3e4c8}
#stage{position:relative;overflow:hidden}
#field{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#hud{position:absolute;inset:0}
.px{position:absolute}
.frame{background:#1b1a26;border:2px solid #8a6a4a;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #3a3040;border-radius:4px}
.face{background-repeat:no-repeat;image-rendering:pixelated}
/* 行動の順番 */
#tl{display:flex;align-items:center;gap:3px;padding:3px 6px}
#tl .hg{color:#d9b37a;font-size:14px;width:14px;text-align:center}
#tl .ic{position:relative;overflow:hidden;border:1px solid #5a4a3e;border-radius:3px;background:#2a2f40}
#tl .ic.foe{background:#3a2a30}
#tl .ic.now{border-color:#ffd88a;box-shadow:0 0 0 1px #ffd88a}
/* 技の名前 */
#banner{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;color:#ffe3a8;text-shadow:0 2px 0 #000;opacity:0;transition:opacity .15s}
#banner.on{opacity:1}
#banner.act{color:#fff;background:linear-gradient(#5a3a20,#2a1b14);border-color:#e8b45a}
#banner .k{font-size:11px;color:#c9a46c;border:1px solid #6a5040;border-radius:3px;padding:1px 4px}
/* 下の仲間の札 */
.card{overflow:hidden}
.card.on{border-color:#ffd88a;box-shadow:0 0 0 1px #000,0 0 10px #ffd88a88}
.card .bar{position:absolute;left:5%;right:5%;height:5%;background:#1c252b;border-radius:1px;overflow:hidden}
.card .bar i{position:absolute;left:0;top:0;bottom:0;background:#6ab261}
.card .bar.g i{background:#4f91c2}
.card .bar.g.full i{background:#ffcf6a;animation:full .5s infinite alternate}
@keyframes full{to{background:#fff3c4}}
.card.ko .face{filter:grayscale(1) brightness(.45)}
.card .sh{position:absolute;right:3px;top:3px;font-size:10px;color:#9fd4ff;font-weight:800;font-family:system-ui,sans-serif;text-shadow:0 1px 0 #000}
/* 数字と知らせ */
.num{position:absolute;font-family:"Avenir Next",system-ui,sans-serif;font-weight:900;color:#fff;text-shadow:0 2px 0 #000,2px 0 0 #000,-2px 0 0 #000,0 -2px 0 #000;pointer-events:none;transform:translate(-50%,-50%);animation:pop .9s ease-out forwards;white-space:nowrap}
.num.crit{color:#ffd23a}
.num.heal{color:#9ff0a0}
.num.guard{color:#9fd4ff}
.num.foe{color:#ff9a8a}
@keyframes pop{0%{transform:translate(-50%,-30%) scale(.6);opacity:0}15%{transform:translate(-50%,-60%) scale(1.15);opacity:1}70%{transform:translate(-50%,-80%) scale(1);opacity:1}100%{transform:translate(-50%,-110%);opacity:0}}
.note{position:absolute;transform:translate(-50%,0);font-size:11px;font-weight:800;color:#ffe08a;background:#000a;border:1px solid #c9963a;border-radius:3px;padding:1px 5px;white-space:nowrap;pointer-events:none;animation:note 1.1s ease-out forwards}
@keyframes note{0%{opacity:0;transform:translate(-50%,4px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}
.st{position:absolute;display:flex;gap:2px;transform:translateX(-50%)}
.st b{font-size:9px;font-family:system-ui,sans-serif;font-weight:800;padding:0 3px;border-radius:2px;line-height:13px}
.st .burn{background:#b8452a;color:#ffe0c0}
.st .mark{background:#2a5aa8;color:#d8ecff}
.st .poison{background:#6a3a8a;color:#f0d8ff}
.st .ctl{background:#c9a43a;color:#2a1a00}
.st .elb{color:#fff;text-shadow:0 1px 0 #0008;min-width:1em;text-align:center}
.st.cs{flex-direction:column;align-items:flex-start;transform:none}
.el{border-radius:50%;color:#fff;font-weight:800;text-align:center;font-family:"Hiragino Sans",system-ui,sans-serif;text-shadow:0 1px 0 #0008;box-shadow:0 0 0 1px #000}
.num.poison{color:#d9a0ff}
.veil .sub{font-size:13px;color:#e8d5b0;text-align:center;line-height:1.7}
.veil .sub b{color:#ffd88a;font-size:16px}
.veil.solid{display:block;background:#0e0f17}
.tile{overflow:hidden;cursor:pointer}
.tile.sel{border-color:#ffd88a;box-shadow:0 0 0 1px #000,0 0 8px #ffd88a88}
.rowtag{text-align:center;font-weight:800;border-radius:3px;cursor:pointer;font-family:"Hiragino Sans",system-ui,sans-serif}
.rowtag.front{background:#8a4a2a;color:#ffe3c8}
.rowtag.back{background:#2a4a7a;color:#d8e8ff}
.t{white-space:nowrap;overflow:hidden;pointer-events:none}
.t.right{text-align:right}
.t.dim{color:#a89a86}
.t.gold{color:#ffd88a;font-weight:800}
.t.name{font-weight:800;color:#ffe3a8}
.t.name+.t b,.t.right b{color:#ffd88a;font-size:1.3em}
.t.num2{font-family:"Avenir Next",system-ui,sans-serif;font-weight:700;color:#f3e4c8}
.t.num2 i{font-style:normal;color:#7ee08a;font-size:.85em;margin-left:2px}
.t.tag{color:#fff;text-align:center;border-radius:3px;font-weight:800;font-family:"Hiragino Sans",system-ui,sans-serif}
.t.label{color:#c9a46c;font-weight:800}
.t.sname{font-weight:800;color:#f3e4c8}
.t.sdesc{color:#bfb2a0}
.hc{display:inline-block;margin-left:5px;padding:0 4px;border-radius:2px;background:#e8e4da;color:#333;font-size:.72em;vertical-align:middle;line-height:1.3}
.slot{border:1px solid #4a3e36;border-radius:4px;background:#191822;cursor:pointer}
.slot.on{border-color:#ffd88a;background:#2a2418;box-shadow:0 0 6px #ffd88a55}
.cand{border-bottom:1px solid #2e2a30;cursor:pointer}
.cand.now{background:#221f18;cursor:default}
.cand:not(.now):active{background:#2a2a3a}
.glowline{filter:drop-shadow(0 0 1.5px currentColor)}
/* ロマサガRS型 */
.foehit{cursor:pointer}
.aim{position:absolute;transform:translate(-50%,0);color:#ffd88a;text-shadow:0 1px 0 #000;pointer-events:none;animation:aim .8s ease-in-out infinite alternate}
@keyframes aim{to{transform:translate(-50%,3px)}}
.card{cursor:pointer}
.card .info{position:absolute;left:4%;right:4%;display:flex;justify-content:space-between;align-items:center;font-family:"Avenir Next",system-ui,sans-serif;color:#c9b08c;font-weight:700}
.card .info b{color:#f3e4c8;margin-left:1px;font-size:1.2em}
.card .info .bp b{color:#9fd4ff}
.cmdtag{position:absolute;right:2px;background:#000b;color:#ffe08a;border-radius:2px;padding:0 3px;font-weight:800;white-space:nowrap;pointer-events:none;font-family:"Hiragino Sans",system-ui,sans-serif}
.cmdtag:empty{display:none}
.cmd{cursor:pointer;overflow:hidden}
.cmd .cn{position:absolute;left:6%;top:9%;font-weight:800;color:#f3e4c8;white-space:nowrap}
.cmd .cb{position:absolute;right:5%;top:11%;font-weight:800;color:#9fd4ff;font-family:"Avenir Next",system-ui,sans-serif}
.cmd .cd{position:absolute;left:6%;right:4%;bottom:9%;color:#bfb2a0;white-space:nowrap;overflow:hidden}
.cmd .cd i{font-style:normal;font-weight:800;margin-right:3px}
.cmd.off{visibility:hidden;pointer-events:none}
.cmd.dim{opacity:.4;cursor:default}
.cmd.sel{border-color:#ffd88a;background:#2a2418}
.cmd:not(.dim):not(.off):active{filter:brightness(1.3)}
.btn b{color:#ffd88a;margin-left:2px}
.btn.lit{border-color:#ffd88a;background:#2a2418}
.chip.sel{border-color:#ffd88a;background:#2a2418;color:#ffe3a8}
.tile .hate{position:absolute;left:0;right:0;bottom:1px;text-align:center;color:#ffb08a;font-weight:800;white-space:nowrap;font-family:"Hiragino Sans",system-ui,sans-serif}
.pick2{flex-direction:column;cursor:pointer}
.pick2 .pn{font-weight:800}
.pick2 .ps{color:#c9b08c;font-weight:400;margin-top:1px}
.t.dim2{color:#bfb2a0}
.num .tag{display:block;margin:0 auto -.1em;width:max-content;font-size:.5em;line-height:1.25;padding:0 .35em;border-radius:.2em;color:#fff;text-shadow:none;letter-spacing:.04em}
.num .tag.weak{background:#e8382c;box-shadow:0 0 0 .1em #000}
.num .tag.resist{background:#2f7fe0;box-shadow:0 0 0 .1em #000}
#banner.chain{color:#fff;background:linear-gradient(#6a2a5a,#2a1430);border-color:#ff9ae0}
/* ボタン */
.btn{display:flex;align-items:center;justify-content:center;font-family:inherit;color:#f3e4c8;font-weight:700;cursor:pointer}
.btn:active{filter:brightness(1.3)}
.veil{position:absolute;inset:0;background:#0b0d14d8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.veil .big{font-size:34px;font-weight:800;color:#ffd88a;text-shadow:0 3px 0 #000}
.rank{display:grid;grid-template-columns:36px 64px 1fr 44px;align-items:center;gap:6px;width:86%;font-size:13px}
.rank .bar2{height:8px;background:#2a2430;border-radius:2px;overflow:hidden}
.rank .bar2 i{display:block;height:100%;background:linear-gradient(90deg,#c9963a,#ffd88a)}
.rank .v{text-align:right;font-family:"Avenir Next",system-ui,sans-serif;font-weight:800}
.pick{width:86%;padding:12px;font-size:16px}
.pick small{display:block;font-size:11px;color:#c9b08c;font-weight:400;margin-top:2px}

/* 横向きの戦闘画面（ロマサガRS型） */
.topbar{display:flex;gap:16px;align-items:center;padding-left:12px;color:#c9d4c0;font-family:"Avenir Next",system-ui,sans-serif;font-weight:700;letter-spacing:.02em}
.topbar b{color:#ffe08a;font-size:1.25em;margin-left:2px}
.info .nm,.info .hpb,.info .res{position:absolute}
.info .nm{font-weight:800;color:#fff;white-space:nowrap;text-shadow:0 1px 0 #000}
.info .nm em{font-style:normal;color:#ff5a4a;margin-right:4px;font-family:"Avenir Next",system-ui,sans-serif;font-weight:900}
.info .hpb{background:#2a1a20;border:1px solid #000;border-radius:2px;overflow:hidden}
.info .hpb i{display:block;height:100%;background:linear-gradient(#ff7a4a,#d8402a)}
.info .res{display:flex;gap:2px}
.ri{display:flex;flex-direction:column;align-items:center}
.ri i{font-style:normal;height:1em;line-height:1em;font-weight:900}
.ri i.up{color:#ff5a4a}.ri i.dn{color:#5aa0ff}
.at{display:inline-block;text-align:center;color:#fff;border-radius:2px;font-weight:800;font-family:"Hiragino Sans",system-ui,sans-serif;text-shadow:0 1px 0 #0008;box-shadow:0 0 0 1px #0008;margin-right:1px}
.skillname{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;background:linear-gradient(90deg,#0000,#000c 20%,#000c 80%,#0000);text-shadow:0 1px 0 #000;opacity:0;transition:opacity .12s;pointer-events:none}
.skillname.on{opacity:1}
.panel{pointer-events:auto}
.pcard,.pst,.plist,.bbtn{box-sizing:border-box}
.pcard{background:linear-gradient(90deg,#123a3a,#1a2a3a);border-color:#4ab0a0}
.pcard .pn,.pcard .ps,.pcard .pdots{position:absolute;white-space:nowrap}
.pcard .pn{font-weight:800;color:#fff}
.pcard .ps{color:#a8d0c8}
.pdots{display:flex;gap:4px}
.pdots i{width:7px;height:7px;border-radius:50%;background:#2a4040;border:1px solid #4a7070}
.pdots i.done{background:#4ab0a0}.pdots i.on{background:#ffe08a;border-color:#ffe08a}.pdots i.ko{opacity:.3}
.pst{display:flex;align-items:center;justify-content:space-between;padding:0 8px;background:#14262a;border-color:#3a7a70;font-family:"Avenir Next",system-ui,sans-serif;font-weight:800;color:#fff}
.pst .k{color:#8fd0c4}.pst small{color:#a8c0bc;font-size:.75em;margin-left:1px}
.plist{background:#0e1a26;border-color:#3a6a80;overflow:hidden}
.srow{position:absolute;border-radius:3px;cursor:pointer;border-bottom:1px solid #1e3040}
.srow span{position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap}
.srow .ic{display:flex;gap:1px}
.srow .sn{font-weight:800;color:#f0f4f8}
.srow .rg{color:#8ab0c8}
.srow .bp{color:#ffe08a;font-weight:800;font-family:"Avenir Next",system-ui,sans-serif}
.srow.sel{background:#1e4a60;box-shadow:inset 0 0 0 1px #6ad0ff}
.srow.heart .sn{color:#d8b8ff}
.srow.dim{opacity:.35;cursor:default}
.srow:not(.dim):active{background:#2a5a70}
.bottombar{pointer-events:auto}
.bbtn{display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:#f3e4c8;font-weight:800;text-align:center;line-height:1.05}
.bbtn b{color:#ffe08a}
.bbtn.dim{opacity:.35;cursor:default}
.bbtn.auto{background:#14304a;border-color:#4a90d0;color:#cfe8ff}
.bbtn.auto.lit{background:#1e5a8a;border-color:#9fd4ff;box-shadow:0 0 8px #4ab0ff88}
.bbtn .sw{border-radius:50%;background:#2a8a6a;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px #000}
.bbtn.rep{background:#5a3a14;border-color:#e0a040;color:#ffe0a0}
.bbtn.ff.lit{border-color:#ffd88a;color:#ffd88a}
.tile .tn{position:absolute;color:#f3e4c8;font-weight:800;line-height:1.25;white-space:nowrap;font-family:"Hiragino Sans",system-ui,sans-serif}
.tile .tn i{font-style:normal;color:#ffb08a;font-weight:700}
</style>
</head>
<body>
<div id="stage"><canvas id="field" width="1204" height="2620"></canvas><div id="hud"></div></div>
<script src="js/scene.js?v=22"></script>
<script src="js/engine.js?v=22"></script>
<script src="js/view.js?v=22"></script>
</body>
</html>
